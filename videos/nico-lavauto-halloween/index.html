<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Creepster"; src: url("assets/fonts/creepster.woff2") format("woff2"); }
      @font-face { font-family: "Anton"; src: url("assets/fonts/anton.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-style: normal; font-weight: 100 900; src: url("assets/fonts/montserrat.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #050307; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #050307; font-family: "Montserrat", sans-serif; color: #fff; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .abs { position: absolute; }
      .photo { position: absolute; overflow: hidden; }
      .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      /* the "dirty" look: sickly green, crushed, grainy */
      .dirty img { filter: grayscale(0.55) sepia(0.35) hue-rotate(55deg) saturate(1.4) brightness(0.62) contrast(1.35); }
      /* the "clean" look: warm, bright, glossy */
      .clean img { filter: saturate(1.18) brightness(1.1) contrast(1.06); }
      .creep { font-family: "Creepster", cursive; font-weight: 400; color: #E01E1E; text-shadow: 0 0 18px rgba(255, 0, 0, 0.55), 0 6px 0 #4A0000, 0 10px 30px rgba(0, 0, 0, 0.9); letter-spacing: 0.02em; white-space: nowrap; }
      .anton { font-family: "Anton", sans-serif; font-weight: 400; text-transform: uppercase; white-space: nowrap; letter-spacing: 0.01em; }
      .ctr { left: 0; right: 0; text-align: center; }
      .badge { position: absolute; height: 92px; padding: 0 34px; border-radius: 46px; line-height: 92px; white-space: nowrap; }
      .b-avant { background: rgba(20, 0, 0, 0.72); border: 3px solid #E01E1E; color: #FF3B3B; font-family: "Creepster", cursive; font-size: 60px; box-shadow: 0 0 30px rgba(224, 30, 30, 0.6); }
      .b-apres { background: linear-gradient(135deg, #FFB12B, #FF6A00); color: #fff; font-family: "Anton", sans-serif; font-size: 52px; letter-spacing: 0.04em; box-shadow: 0 12px 40px rgba(255, 140, 0, 0.55); border: 3px solid #FFE3A3; display: flex; align-items: center; gap: 14px; }
      .b-apres svg { width: 46px; height: 46px; fill: none; stroke: #fff; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
      .zone { position: absolute; left: 0; right: 0; top: 230px; text-align: center; }
      .zone span { display: inline-block; padding: 14px 34px; border-radius: 40px; background: rgba(10, 6, 16, 0.6); border: 2px solid rgba(255, 255, 255, 0.35); font-weight: 800; font-size: 34px; letter-spacing: 0.22em; padding-left: calc(34px + 0.22em); white-space: nowrap; }
      .sweep { position: absolute; top: -100px; width: 70px; height: 2120px; margin-left: -35px; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,240,200,0.95) 45%, #fff 50%, rgba(255,240,200,0.95) 55%, rgba(255,255,255,0)); box-shadow: 0 0 60px 30px rgba(255, 170, 40, 0.55); transform: rotate(6deg); }
      .spark { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; }
      .spark svg { width: 100%; height: 100%; }
      .bat { position: absolute; width: 120px; height: 60px; }
      .bat svg { width: 100%; height: 100%; fill: #0A0508; }
      .ring { position: absolute; border: 6px solid #FF2A2A; border-radius: 50%; box-shadow: 0 0 24px rgba(255, 30, 30, 0.8), inset 0 0 18px rgba(255, 30, 30, 0.5); }
      .card { position: absolute; left: 70px; right: 70px; height: 150px; border-radius: 34px; background: linear-gradient(135deg, rgba(255,255,255,0.14), rgba(255,255,255,0.06)); border: 2px solid rgba(255, 190, 90, 0.7); box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 40px rgba(255, 120, 0, 0.25); display: flex; align-items: center; gap: 30px; padding: 0 36px; white-space: nowrap; }
      .card .ic { width: 96px; height: 96px; border-radius: 28px; background: linear-gradient(135deg, #FFB12B, #FF5A00); display: flex; align-items: center; justify-content: center; flex: none; }
      .card .ic svg { width: 54px; height: 54px; fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
      .card .l1 { font-weight: 600; font-size: 26px; letter-spacing: 0.14em; color: #FFC98A; text-transform: uppercase; }
      .card .l2 { font-weight: 800; font-size: 46px; color: #fff; margin-top: 4px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="54.5" data-width="1080" data-height="1920">
      <div id="s1" class="scene clip" data-start="0" data-duration="5.6" data-track-index="1"></div>
      <div id="s2" class="scene clip" data-start="5.6" data-duration="8.0" data-track-index="2"></div>
      <div id="s3" class="scene clip" data-start="13.6" data-duration="5.5" data-track-index="1"></div>
      <div id="s4" class="scene clip" data-start="19.1" data-duration="3.5" data-track-index="2"></div>
      <div id="s5" class="scene clip" data-start="22.6" data-duration="9.0" data-track-index="1"></div>
      <div id="s6" class="scene clip" data-start="31.6" data-duration="4.6" data-track-index="2"></div>
      <div id="s7" class="scene clip" data-start="36.2" data-duration="18.3" data-track-index="1"></div>
      <!-- horror overlays: fog, grain, vignette (0 -> 16.5) -->
      <div id="horror" class="clip" data-start="0" data-duration="19.1" data-track-index="4" style="position:absolute;inset:0;pointer-events:none;overflow:hidden">
        <div id="fog1" class="abs" style="left:-600px;top:900px;width:2400px;height:1300px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(150,190,170,0.32),rgba(150,190,170,0) 65%);filter:blur(30px)"></div>
        <div id="fog2" class="abs" style="left:-900px;top:1250px;width:2600px;height:1000px;border-radius:50%;background:radial-gradient(ellipse at center,rgba(120,160,150,0.28),rgba(120,160,150,0) 65%);filter:blur(30px)"></div>
        <div id="grain" class="abs" style="left:-256px;top:-256px;width:1592px;height:2432px;background:url(assets/fx/noise.png);opacity:0.22;mix-blend-mode:overlay"></div>
        <div class="abs" style="inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 35%,rgba(0,0,0,0.85) 100%)"></div>
      </div>
      <div id="bats" class="clip" data-start="0" data-duration="22.6" data-track-index="5" style="position:absolute;inset:0;pointer-events:none;overflow:hidden"></div>
      <div id="flash" class="clip" data-start="0" data-duration="54.5" data-track-index="6" style="position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0"></div>
      <div id="redflash" class="clip" data-start="0" data-duration="22" data-track-index="7" style="position:absolute;inset:0;pointer-events:none;background:#B00000;mix-blend-mode:multiply;opacity:0"></div>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="54.5" data-track-index="10" data-volume="1"></audio>
    </div>

    <script>
      const T = { s1: 0, s2: 5.6, s3: 13.6, s4: 19.1, s5: 22.6, s6: 31.6, s7: 36.2, end: 54.5, pairs: [22.6, 24.4, 26.2, 28.0, 29.8], cuts: [5.7, 7.3, 9.04], dim: 12.0, scare: 18.4, show: 34.95, vo7: 36.35, vo8: 39.7, vo9: 50.6 };
      const $ = (id) => document.getElementById(id);
      const H = (id, html) => ($(id).innerHTML = html);
      const ph = (name, cls, pos, id) => `<div class="photo ${cls}" ${id ? `id="${id}"` : ""} style="inset:0"><img src="assets/photos/${name}.jpg" alt="" style="object-position:${pos || "50% 50%"}" /></div>`;
      let seed = 11;
      const rnd = () => ((seed = (seed * 16807) % 2147483647) - 1) / 2147483646;
      const BAT = '<svg viewBox="0 0 120 60"><path d="M60 22 C56 14 52 12 50 16 C44 6 30 2 14 8 C22 12 24 18 22 26 C30 22 36 24 40 32 C46 28 52 30 56 38 L60 30 L64 38 C68 30 74 28 80 32 C84 24 90 22 98 26 C96 18 98 12 106 8 C90 2 76 6 70 16 C68 12 64 14 60 22 Z"/></svg>';
      const STAR = '<svg viewBox="0 0 100 100"><path d="M50 0 C53 36 64 47 100 50 C64 53 53 64 50 100 C47 64 36 53 0 50 C36 47 47 36 50 0 Z" fill="#FFF6D8"/><circle cx="50" cy="50" r="9" fill="#fff"/></svg>';
      const CHECK = '<svg viewBox="0 0 48 48"><path d="M10 25 l9 9 l19 -20"/></svg>';

      // ---------- bats (horror + banish) ----------
      H("bats", Array.from({ length: 9 }, (_, k) => `<div class="bat" id="bat${k}" style="left:0;top:0">${BAT}</div>`).join(""));

      // ---------- S1: flashlight in the dark ----------
      H("s1", `<div id="s1-cam" class="abs" style="inset:-40px">${ph("driver-before", "dirty", "30% 60%", "s1-ph")}</div>
        <div id="s1-dark" class="abs" style="inset:0;--x:300px;--y:1200px;background:radial-gradient(circle 470px at var(--x) var(--y),rgba(0,0,0,0) 0%,rgba(0,0,0,0.3) 50%,rgba(2,0,4,0.86) 100%)"></div>
        <div id="s1-t1" class="creep abs ctr" style="top:330px;font-size:150px">Cette nuit…</div>
        <div id="s1-t2" class="abs ctr" style="top:540px;font-weight:700;font-size:46px;letter-spacing:0.18em;color:#D9E8DC;text-shadow:0 4px 20px #000">QUELQUE CHOSE S'EST INSTALLÉ</div>
        <div id="s1-t3" class="creep abs ctr" style="top:1440px;font-size:118px">dans votre voiture</div>`);

      // ---------- S2: the dirt, three flicker cuts ----------
      const DIRT = [["rearL-before", "64% 72%", "Miettes", [800, 1400, 400, 280]], ["rearR-before", "22% 70%", "Poussière", [220, 1330, 400, 300]], ["passenger-before", "68% 70%", "Saletés", [820, 1470, 400, 300]]];
      H("s2", DIRT.map((d, k) => `<div id="s2-c${k}" class="abs" style="inset:0;opacity:0">
          <div id="s2-z${k}" class="abs" style="inset:0">${ph(d[0], "dirty", d[1])}</div>
          <div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.55),rgba(0,0,0,0) 30%,rgba(0,0,0,0) 65%,rgba(0,0,0,0.6))"></div>
          <div id="s2-r${k}" class="ring" style="left:${d[3][0] - d[3][2] / 2}px;top:${d[3][1] - d[3][3] / 2}px;width:${d[3][2]}px;height:${d[3][3]}px"></div>
          <div id="s2-w${k}" class="creep abs ctr" style="top:380px;font-size:190px">${d[2]}</div>
        </div>`).join("") + `<div class="badge b-avant" style="left:60px;top:1640px">Avant</div>`);

      // ---------- S3: the trunk + jump scare ----------
      H("s3", `<div id="s3-cam" class="abs" style="inset:0">${ph("trunk-before", "dirty", "50% 55%", "s3-ph")}</div>
        <div id="s3-dark" class="abs" style="inset:0;--x:540px;--y:1100px;background:radial-gradient(circle 520px at var(--x) var(--y),rgba(0,0,0,0) 0%,rgba(0,0,0,0.3) 50%,rgba(2,0,4,0.86) 100%)"></div>
        <div id="s3-t1" class="creep abs ctr" style="top:300px;font-size:170px">Le coffre…</div>
        <div id="s3-t2" class="abs ctr" style="top:1500px;font-weight:800;font-size:50px;letter-spacing:0.12em;color:#fff;text-shadow:0 4px 24px #000">PERSONNE N'OSE L'OUVRIR</div>`);

      // ---------- S4: the demon hunters arrive ----------
      H("s4", `<div class="abs" style="inset:0;background:radial-gradient(circle at 50% 42%,#FFB03A 0%,#E9560C 32%,#5A1206 68%,#14040A 100%)"></div>
        <div id="s4-rays" class="abs" style="left:-460px;top:-160px;width:2000px;height:2000px;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,236,170,0.22) 0deg 7deg,rgba(255,236,170,0) 7deg 22deg);border-radius:50%"></div>
        <div id="s4-moon" class="abs" style="left:240px;top:280px;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle at 40% 38%,#FFF4D6,#FFD27A 55%,#FF9A2E);box-shadow:0 0 140px 40px rgba(255,190,80,0.55);opacity:0.55"></div>
        <img id="s4-logo" src="assets/logo/logo.png" alt="" class="abs" style="left:150px;top:300px;width:780px;height:auto" />
        <div id="s4-t1" class="anton abs ctr" style="top:1270px;font-size:104px;color:#fff;text-shadow:0 8px 0 #7A1A00,0 0 40px rgba(255,120,0,0.8)">On chasse</div>
        <div id="s4-t2" class="anton abs ctr" style="top:1400px;font-size:150px;color:#FFE08A;text-shadow:0 10px 0 #7A1A00,0 0 50px rgba(255,140,0,0.9)">les démons</div>`);

      // ---------- S5: before / after, five zones ----------
      const PAIRS = [["driver", "Place conducteur", "28% 60%", "34% 60%"], ["rearL", "Arrière gauche", "55% 60%", "60% 60%"], ["rearR", "Arrière droit", "35% 60%", "62% 60%"], ["passenger", "Place passager", "45% 60%", "45% 60%"], ["trunk", "Coffre", "50% 55%", "50% 60%"]];
      const SP = [[[240, 760], [820, 1040], [560, 1380]], [[300, 900], [780, 760], [640, 1420]], [[260, 1100], [800, 900], [460, 1500]], [[240, 820], [820, 1200], [520, 1480]], [[300, 1000], [800, 980], [540, 1360]]];
      H("s5", PAIRS.map((p, k) => `<div id="s5-p${k}" class="abs" style="inset:0;overflow:hidden">
          <div id="s5-b${k}" class="abs" style="inset:0">${ph(p[0] + "-before", "dirty", p[2])}</div>
          <div id="s5-a${k}" class="abs" style="inset:0;clip-path:inset(0 100% 0 0)"><div id="s5-ai${k}" class="abs" style="inset:0">${ph(p[0] + "-after", "clean", p[3])}</div>
            <div id="s5-gl${k}" class="abs" style="left:-600px;top:-200px;width:300px;height:2400px;transform:rotate(18deg);background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,0.35),rgba(255,255,255,0))"></div></div>
          <div class="abs" style="left:0;right:0;top:0;height:420px;background:linear-gradient(180deg,rgba(0,0,0,0.6),rgba(0,0,0,0))"></div>
          <div class="abs" style="left:0;right:0;bottom:0;height:420px;background:linear-gradient(0deg,rgba(0,0,0,0.55),rgba(0,0,0,0))"></div>
          <div id="s5-sw${k}" class="sweep" style="left:-120px"></div>
          ${SP[k].map((s, j) => `<div id="s5-s${k}-${j}" class="spark" style="left:${s[0]}px;top:${s[1]}px">${STAR}</div>`).join("")}
          <div class="zone"><span id="s5-z${k}">${p[1].toUpperCase()}</span></div>
          <div id="s5-bv${k}" class="badge b-avant" style="left:60px;top:1600px">Avant</div>
          <div id="s5-ba${k}" class="badge b-apres" style="right:60px;top:1600px">${CHECK}APRÈS</div>
        </div>`).join("") + `<div class="abs" style="left:0;right:0;top:1740px;display:flex;justify-content:center;gap:16px">${PAIRS.map((_, k) => `<div style="width:70px;height:10px;border-radius:5px;background:rgba(255,255,255,0.25);overflow:hidden"><div id="s5-d${k}" style="width:100%;height:100%;background:#FFB12B;transform-origin:0 50%"></div></div>`).join("")}</div>`);

      // ---------- S6: nightmare -> showroom ----------
      H("s6", `<div id="s6-top" class="abs" style="left:0;top:0;width:1080px;height:960px;overflow:hidden">${ph("driver-before", "dirty", "30% 55%")}<div class="abs" style="inset:0;background:rgba(10,0,0,0.25)"></div></div>
        <div id="s6-bot" class="abs" style="left:0;top:960px;width:1080px;height:960px;overflow:hidden">${ph("driver-after", "clean", "34% 55%")}</div>
        <div id="s6-line" class="abs" style="left:-40px;top:940px;width:1160px;height:40px;background:linear-gradient(90deg,#FF5A00,#FFE08A,#FF5A00);box-shadow:0 0 50px 10px rgba(255,150,0,0.7)"></div>
        <div id="s6-w1" class="creep abs ctr" style="top:380px;font-size:170px">Cauchemar</div>
        <div id="s6-ar" class="abs" style="left:470px;top:850px;width:140px;height:140px;border-radius:70px;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 48 48" style="width:76px;height:76px;fill:none;stroke:#FF5A00;stroke-width:6;stroke-linecap:round;stroke-linejoin:round"><path d="M24 8 v32 M11 27 l13 13 l13 -13"/></svg></div>
        <div id="s6-w2" class="anton abs ctr" style="top:1300px;font-size:200px;color:#fff;text-shadow:0 10px 0 #B84300,0 0 60px rgba(255,170,40,0.9)">Showroom</div>`);

      // ---------- S7: CTA ----------
      const W7 = ["VOTRE", "VOITURE", "MÉRITE", "MIEUX", "QUE", "L'HORREUR."];
      H("s7", `<div class="photo clean" style="inset:0">${`<img src="assets/photos/rearR-after.jpg" alt="" style="filter:blur(28px) brightness(0.45) saturate(1.3);transform:scale(1.15)" />`}</div>
        <div class="abs" style="inset:0;background:radial-gradient(circle at 50% 20%,rgba(255,120,20,0.5),rgba(40,8,30,0.75) 55%,rgba(8,2,10,0.95))"></div>
        <div id="s7-head" class="abs" style="left:0;right:0;top:300px">
          <div class="anton ctr" style="position:relative;font-size:120px;line-height:1.08">${W7.slice(0, 3).map((w, k) => `<span id="s7-w${k}" style="display:inline-block;margin:0 14px">${w}</span>`).join("")}</div>
          <div class="anton ctr" style="position:relative;font-size:120px;line-height:1.08">${W7.slice(3, 5).map((w, k) => `<span id="s7-w${k + 3}" style="display:inline-block;margin:0 14px">${w}</span>`).join("")}</div>
          <div class="creep ctr" style="position:relative;font-size:168px;line-height:1.1;margin-top:10px"><span id="s7-w5" style="display:inline-block">L'horreur.</span></div>
        </div>
        <img id="s7-logo" src="assets/logo/logo.png" alt="" class="abs" style="left:300px;top:250px;width:480px;height:auto" />
        <div id="s7-cta" class="abs ctr" style="top:900px;font-weight:800;font-size:44px;letter-spacing:0.06em;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,0.7)">CONTACTEZ-NOUS POUR UN LAVAGE</div>
        <div id="s7-mail" class="card" style="top:1000px"><div class="ic"><svg viewBox="0 0 48 48"><rect x="6" y="11" width="36" height="27" rx="4"/><path d="M7 13 l17 13 l17 -13"/></svg></div><div><div class="l1">E-mail</div><div class="l2" style="font-size:42px">nicolavauto38@gmail.com</div></div></div>
        <div id="s7-tel" class="card" style="top:1190px"><div class="ic"><svg viewBox="0 0 48 48"><path d="M14 6 h7 l3 10 -5 3 a24 24 0 0 0 10 10 l3 -5 10 3 v7 a4 4 0 0 1 -4 4 C22 38 10 26 10 10 a4 4 0 0 1 4 -4 z"/></svg></div><div><div class="l1">Téléphone</div><div class="l2" style="font-size:58px;letter-spacing:0.03em">07 77 03 39 53</div></div></div>
        <div id="s7-msg" class="card" style="top:1380px;border-color:rgba(170,120,255,0.8)"><div class="ic" style="background:linear-gradient(135deg,#0099FF,#A033FF 60%,#FF5280)"><svg viewBox="0 0 48 48"><path d="M24 6 C13.5 6 6 13.4 6 23 c0 5.3 2.4 9.9 6.3 13 v6.5 l6 -3.3 c1.8 0.5 3.7 0.8 5.7 0.8 c10.5 0 18 -7.4 18 -17 S34.5 6 24 6 z"/><path d="M13 27 l7.5 -8 l4.5 4.5 l9 -4.5 l-7.5 8 l-4.5 -4.5 z" fill="#fff"/></svg></div><div><div class="l1">Réservation</div><div class="l2" style="font-size:52px">Sur Messenger</div></div></div>
        <div id="s7-foot" class="abs ctr" style="top:1590px;font-weight:600;font-size:30px;letter-spacing:0.3em;color:#FFC98A">NICO LAV'AUTO · NETTOYAGE DE VOITURES</div>`);

      // ================= TIMELINE =================
      const tl = gsap.timeline({ paused: true });
      const flick = (sel, t0, n, dur) => { for (let i = 0; i < n; i++) tl.set(sel, { opacity: rnd() < 0.5 ? 0.15 : 1 }, t0 + (dur * i) / n); tl.set(sel, { opacity: 1 }, t0 + dur); };
      const flash = (t, a, d) => tl.fromTo("#flash", { opacity: a }, { opacity: 0, duration: d || 0.35, ease: "power2.out", immediateRender: false }, t);
      const shake = (sel, t, d, amp) => { const n = Math.round(d / 0.04); for (let i = 0; i < n; i++) tl.to(sel, { x: (rnd() - 0.5) * 2 * amp, y: (rnd() - 0.5) * 2 * amp, duration: 0.04, ease: "none" }, t + i * 0.04); tl.to(sel, { x: 0, y: 0, duration: 0.05 }, t + d); };

      // overlays: fog drift + grain jitter (stepped, seek-safe)
      tl.fromTo("#fog1", { x: -200 }, { x: 300, duration: 19.1, ease: "sine.inOut" }, 0);
      tl.fromTo("#fog2", { x: 300 }, { x: -250, duration: 19.1, ease: "sine.inOut" }, 0);
      for (let i = 0; i < 19.1 * 12; i++) tl.set("#grain", { x: Math.floor(rnd() * 256), y: Math.floor(rnd() * 256) }, i / 12);

      // bats: drift across in the horror part, then flee at the banish
      for (let k = 0; k < 9; k++) {
        const y0 = 150 + rnd() * 700, sc = 0.5 + rnd() * 0.8, t0 = rnd() * 12;
        tl.fromTo(`#bat${k}`, { x: -200 - rnd() * 300, y: y0, scale: sc, rotation: -8 }, { x: 1300, y: y0 - 200 + rnd() * 300, rotation: 8, duration: 4.5 + rnd() * 3, ease: "sine.inOut" }, t0);
        for (let i = 0; i < 40; i++) tl.set(`#bat${k}`, { scaleY: i % 2 ? sc * 0.45 : sc }, t0 + i * 0.11);
        // banish: burst out from the logo
        const ang = (k / 9) * Math.PI * 2;
        tl.fromTo(`#bat${k}`, { x: 480, y: 780, scale: 0.3, scaleY: 0.3, rotation: 0, opacity: 1 }, { x: 480 + Math.cos(ang) * 1300, y: 780 + Math.sin(ang) * 1300, scale: 1.3, scaleY: 1.3, rotation: (rnd() - 0.5) * 120, duration: 1.1, ease: "power2.in", immediateRender: false }, T.s4 + 0.05);
      }

      // S1
      tl.fromTo("#s1-ph", { scale: 1.12 }, { scale: 1.0, duration: 5.6, ease: "none" }, 0);
      tl.fromTo("#s1-dark", { "--x": "240px", "--y": "1500px" }, { "--x": "820px", "--y": "1250px", duration: 2.6, ease: "sine.inOut" }, 0);
      tl.to("#s1-dark", { "--x": "330px", "--y": "1180px", duration: 3.0, ease: "sine.inOut" }, 2.6);
      tl.fromTo("#s1-t1", { opacity: 0, scale: 1.25, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.0, ease: "power3.out" }, 0.6);
      flick("#s1-t1", 1.3, 5, 0.35);
      tl.fromTo("#s1-t2", { opacity: 0, scale: 1.25, filter: "blur(8px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1.2, ease: "power2.out" }, 1.8);
      tl.fromTo("#s1-t3", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 3.5);
      shake("#s1-t3", 4.15, 0.4, 10);
      flick("#s1-t3", 4.65, 4, 0.3);
      tl.to(["#s1-t1", "#s1-t2", "#s1-t3"], { opacity: 0, duration: 0.25 }, 5.3);

      // S2: three hard cuts, each with a red ring + label
      const C2 = T.cuts;
      C2.forEach((t, k) => {
        tl.set(`#s2-c${k}`, { opacity: 1 }, k ? t : T.s2);
        if (k < 2) tl.set(`#s2-c${k}`, { opacity: 0 }, C2[k + 1]);
        tl.fromTo(`#s2-z${k}`, { scale: 1.0 }, { scale: 1.18, duration: (k < 2 ? C2[k + 1] : T.s3) - t, ease: "power1.in" }, t);
        tl.fromTo(`#s2-w${k}`, { opacity: 0, scale: 1.6, rotation: (k - 1) * 4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, t + 0.15);
        tl.fromTo(`#s2-r${k}`, { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, t + 0.45);
        tl.to(`#s2-r${k}`, { scale: 1.08, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut" }, t + 0.8);
        flash(t, 0.55, 0.18);
        shake(`#s2-w${k}`, t + 0.2, 0.3, 8);
      });

      tl.to("#s2-c2", { opacity: 0.12, duration: T.s3 - T.dim, ease: "power1.in" }, T.dim);

      // S3
      tl.fromTo("#s3-cam", { scale: 1.0 }, { scale: 1.12, duration: T.scare - T.s3 - 0.01, ease: "power1.in" }, T.s3);
      tl.fromTo("#s3-dark", { "--x": "300px", "--y": "1300px" }, { "--x": "560px", "--y": "1000px", duration: 2.8, ease: "sine.inOut" }, T.s3);
      tl.fromTo("#s3-t1", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.8, ease: "power2.out" }, T.s3 + 0.2);
      tl.fromTo("#s3-t2", { opacity: 0 }, { opacity: 1, duration: 0.6 }, T.s3 + 1.8);
      // jump scare
      tl.to("#s3-cam", { scale: 1.45, duration: 0.18, ease: "power4.out" }, T.scare);
      tl.set("#s3-dark", { "--x": "540px", "--y": "1050px", opacity: 0.35 }, T.scare);
      tl.fromTo("#redflash", { opacity: 0.9 }, { opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, T.scare);
      shake("#s3-cam", T.scare, 0.6, 26);
      flick("#s3-t1", T.scare, 6, 0.4);

      // S4: lightning, logo, banish
      flash(T.s4, 1, 0.5);
      flash(T.s4 + 0.55, 0.6, 0.25);
      tl.fromTo("#s4-rays", { rotation: 0 }, { rotation: 40, duration: 4.1, ease: "none" }, T.s4);
      tl.fromTo("#s4-moon", { scale: 0.6 }, { scale: 1.05, duration: 4.1, ease: "power1.out" }, T.s4);
      tl.fromTo("#s4-logo", { scale: 0.2, rotation: -25, opacity: 0 }, { scale: 1, rotation: 0, opacity: 1, duration: 0.8, ease: "back.out(1.7)" }, T.s4 + 0.1);
      tl.to("#s4-logo", { y: -14, duration: 1.4, yoyo: true, repeat: 1, ease: "sine.inOut" }, T.s4 + 0.95);
      tl.fromTo("#s4-t1", { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, T.s4 + 2.3);
      tl.fromTo("#s4-t2", { opacity: 0, scale: 2.2 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, T.s4 + 2.75);
      shake("#s4-t2", T.s4 + 3.1, 0.25, 8);

      // S5: five before/after reveals
      T.pairs.forEach((t, k) => {
        const d = k < 4 ? T.pairs[k + 1] - t : T.s6 - t;
        if (k > 0) { tl.fromTo(`#s5-p${k}`, { yPercent: 100 }, { yPercent: 0, duration: 0.32, ease: "power3.out" }, t - 0.02); tl.set(`#s5-p${k - 1}`, { autoAlpha: 0 }, t + 0.32); }
        else tl.set(`#s5-p${k}`, { yPercent: 0 }, t);
        tl.fromTo(`#s5-b${k}`, { scale: 1.08 }, { scale: 1.0, duration: d, ease: "none" }, t);
        tl.fromTo(`#s5-bv${k}`, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, t + 0.15);
        tl.fromTo(`#s5-z${k}`, { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, t + 0.1);
        const r0 = t + 0.45;
        tl.fromTo(`#s5-sw${k}`, { x: 0 }, { x: 1600, duration: 0.7, ease: "power2.inOut" }, r0);
        tl.fromTo(`#s5-a${k}`, { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.7, ease: "power2.inOut" }, r0);
        tl.fromTo(`#s5-ai${k}`, { scale: 1.08 }, { scale: 1.0, duration: d - 0.6, ease: "power1.out" }, r0);
        tl.fromTo(`#s5-gl${k}`, { x: 0 }, { x: 1800, duration: 0.8, ease: "power2.inOut" }, r0 + 0.65);
        tl.to(`#s5-bv${k}`, { opacity: 0, x: -40, duration: 0.2 }, r0 + 0.15);
        tl.fromTo(`#s5-ba${k}`, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, r0 + 0.6);
        for (let j = 0; j < 3; j++) tl.fromTo(`#s5-s${k}-${j}`, { scale: 0, rotation: 0, opacity: 1 }, { scale: 1.2, rotation: 90, opacity: 0, duration: 0.7, ease: "power2.out" }, r0 + 0.55 + j * 0.12);
        tl.fromTo(`#s5-d${k}`, { scaleX: 0 }, { scaleX: 1, duration: d, ease: "none" }, t);
      });
      [1, 2, 3, 4].forEach((k) => tl.set(`#s5-p${k}`, { yPercent: 100 }, T.s5));
      [0, 1, 2, 3].forEach((k) => tl.set(`#s5-p${k}`, { autoAlpha: 1 }, T.s5));

      // S6
      flash(T.s6, 0.7, 0.3);
      tl.fromTo("#s6-top", { yPercent: -100 }, { yPercent: 0, duration: 0.45, ease: "power3.out" }, T.s6);
      tl.fromTo("#s6-bot", { yPercent: 100 }, { yPercent: 0, duration: 0.45, ease: "power3.out" }, T.s6);
      tl.fromTo("#s6-line", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, T.s6 + 0.3);
      tl.fromTo("#s6-w1", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, T.s6 + 0.5);
      shake("#s6-w1", T.s6 + 0.9, 0.4, 6);
      tl.fromTo("#s6-ar", { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.4, ease: "back.out(2)" }, T.show - 0.6);
      tl.fromTo("#s6-w2", { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1, duration: 0.5, ease: "back.out(2)" }, T.show);
      flash(T.show, 0.35, 0.3);

      // S7
      [0, 1, 2, 3, 4].forEach((k) => tl.fromTo(`#s7-w${k}`, { opacity: 0, y: 70, filter: "blur(10px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.35, ease: "power3.out" }, T.vo7 + k * 0.22));
      tl.fromTo("#s7-w5", { opacity: 0, scale: 1.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, T.vo7 + 1.2);
      shake("#s7-w5", T.vo7 + 1.6, 0.3, 6);
      tl.to("#s7-head", { y: -120, opacity: 0, filter: "blur(12px)", duration: 0.4, ease: "power3.in" }, T.vo8 - 0.4);
      tl.fromTo("#s7-logo", { opacity: 0, scale: 0.3, rotation: -12 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.7, ease: "back.out(1.7)" }, T.vo8 - 0.1);
      tl.to("#s7-logo", { y: -12, duration: 1.5, yoyo: true, repeat: 9, ease: "sine.inOut" }, T.vo8 + 0.6);
      tl.fromTo("#s7-cta", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, T.vo8 + 0.2);
      tl.fromTo("#s7-mail", { opacity: 0, x: -200 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, T.vo8 + 1.4);
      tl.fromTo("#s7-tel", { opacity: 0, x: 200 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, T.vo8 + 5.2);
      tl.fromTo("#s7-foot", { opacity: 0 }, { opacity: 1, duration: 0.6 }, T.vo8 + 6.6);
      tl.to(["#s7-mail", "#s7-tel"], { scale: 1.03, duration: 0.6, yoyo: true, repeat: 5, ease: "sine.inOut" }, T.vo8 + 6.4);
      tl.fromTo("#s7-msg", { opacity: 0, y: 120, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "back.out(1.8)" }, T.vo9 + 0.1);
      tl.to("#s7-msg", { scale: 1.05, duration: 0.5, yoyo: true, repeat: 3, ease: "sine.inOut" }, T.vo9 + 1.6);

      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
    </script>
  </body>
