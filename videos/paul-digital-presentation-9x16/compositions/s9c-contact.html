<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s9c-root { position: absolute; inset: 0; overflow: hidden; }
        #s9c-all { position: absolute; inset: 0; }
        #s9c-x3 { position: absolute; inset: 0; perspective: 1400px; }
        .s9c-say { position: absolute; left: 0; width: 1080px; text-align: center; overflow: hidden; padding-bottom: 0.08em; font-weight: 800; font-size: 56px; letter-spacing: -0.02em; color: #F2F6FF; white-space: nowrap; }
        .s9c-say > span { display: block; }
        #s9c-l1 { top: 660px; }
        #s9c-l2 { top: 732px; }
        #s9c-row { position: absolute; left: 0; top: 880px; width: 1080px; display: flex; justify-content: center; gap: 26px; }
        #s9c-row .chip { position: relative; height: 92px; border-radius: 46px; padding: 0 36px 0 12px; font-size: 36px; gap: 18px; }
        #s9c-row .chip .ic { width: 68px; height: 68px; border-radius: 34px; }
        #s9c-row .chip svg { width: 36px; height: 36px; stroke-width: 2.2; }
        #s9c-card { left: 60px; top: 1050px; width: 960px; height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; }
        #s9c-mic { width: 92px; height: 92px; border-radius: 46px; display: flex; align-items: center; justify-content: center; background: linear-gradient(145deg, #3D86FF, #1A4FD0); box-shadow: 0 0 40px rgba(26,105,250,0.7), inset 0 2px 0 rgba(255,255,255,0.4); }
        #s9c-mic svg { width: 48px; height: 48px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
        #s9c-mail { font-weight: 800; font-size: 46px; letter-spacing: -0.01em; color: #FFFFFF; white-space: nowrap; height: 60px; line-height: 60px; }
        #s9c-mail .c { display: inline-block; }
        #s9c-mail .dom { color: #6FB0FF; }
        #s9c-under { position: absolute; left: 160px; top: 1318px; width: 760px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, rgba(61,134,255,0), #5EB0FF 50%, rgba(61,134,255,0)); box-shadow: 0 0 16px #3D86FF; }
      </style>
      <div id="s9c-root" data-composition-id="s9c-contact" data-width="1080" data-height="1920">
        <div id="s9c-all">
          <div id="s9c-x3"></div>
          <div id="s9c-l1" class="s9c-say"><span id="s9c-t1">Envoyez-moi un message</span></div>
          <div id="s9c-l2" class="s9c-say"><span id="s9c-t2"><span class="blue">en privé</span></span></div>
          <div id="s9c-row">
            <div id="s9c-ig" class="chip"><span class="ic"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.4" cy="6.6" r="0.6"/></svg></span>Instagram</div>
            <div id="s9c-fb" class="chip"><span class="ic"><svg viewBox="0 0 24 24"><path d="M15.5 3H13a4.5 4.5 0 00-4.5 4.5V10H6v4h2.5v7h4v-7h3l.5-4h-3.5V7.8c0-.5.3-.8.8-.8h2.2z"/></svg></span>Facebook</div>
          </div>
          <div id="s9c-card" class="glass">
            <div id="s9c-mic"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.8 6.8l8.2 6.2 8.2-6.2"/></svg></div>
            <div id="s9c-mail"></div>
          </div>
          <div id="s9c-under"></div>
        </div>
      </div>
      <script>
        (function () {
          // the address is typed in step with the voice spelling it out
          const MAIL = "paul.digital.contact@gmail.com";
          const host = document.getElementById("s9c-mail");
          const chars = [...MAIL].map((ch, i) => {
            const s = document.createElement("span");
            s.className = "c" + (i >= 20 ? " dom" : "");
            s.textContent = ch;
            host.appendChild(s);
            return s;
          });
          const tl = gsap.timeline({ paused: true });
          tl.from("#s9c-all", { scale: 0.6, opacity: 0, filter: "blur(20px)", duration: 0.45, ease: "power3.out" }, 0);
          // "Vous êtes intéressé ?"
          const x3 = PDExtrude(document.getElementById("s9c-x3"), "INTÉRESSÉ ?", { size: 118, x: 540, y: 520, layers: 11, step: 6 });
          tl.fromTo(x3, { z: -2200, rotationX: 50, rotationY: -50, scale: 0.6, opacity: 0 }, { z: 0, rotationX: 8, rotationY: -14, scale: 1, opacity: 1, duration: 0.6, ease: "expo.out" }, 0.45);
          tl.to(x3, { rotationY: 12, rotationX: 2, duration: 4.0, ease: "sine.inOut" }, 1.05);
          PDBurst(tl, document.getElementById("s9c-x3"), 540, 520, 0.5, { r: 440, seed: 61, n: 20, dur: 1.4, hold: 1.0 });
          // "Envoyez-moi un message en privé"
          tl.from("#s9c-t1", { yPercent: 115, duration: 0.5, ease: "expo.out" }, 1.8);
          tl.from("#s9c-t2", { yPercent: 115, duration: 0.5, ease: "expo.out" }, 2.6);
          // "sur Instagram ou Facebook"
          tl.from("#s9c-ig", { opacity: 0, scale: 0.4, y: 40, duration: 0.55, ease: "back.out(2.2)" }, 3.55);
          tl.from("#s9c-fb", { opacity: 0, scale: 0.4, y: 40, duration: 0.55, ease: "back.out(2.2)" }, 4.7);
          // "ou par mail : paul point digital point contact arobase gmail point com"
          tl.from("#s9c-card", { opacity: 0, y: 120, rotationX: -40, duration: 0.6, ease: "expo.out" }, 6.2);
          tl.from("#s9c-mic", { scale: 0, rotation: -30, duration: 0.5, ease: "back.out(2.4)" }, 6.4);
          gsap.set(chars, { opacity: 0 });
          const SEG = [[0, 4, 6.95, 0.2], [4, 12, 7.2, 0.6], [12, 20, 8.03, 0.45], [20, 21, 8.7, 0.1], [21, 26, 9.1, 0.38], [26, 30, 9.55, 0.45]];
          SEG.forEach(([a, b, t, d]) => {
            tl.fromTo(chars.slice(a, b), { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.18, ease: "power2.out", stagger: d / Math.max(1, b - a), immediateRender: false }, t);
          });
          tl.fromTo("#s9c-under", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "expo.out" }, 10.1);
          tl.to("#s9c-card", { scale: 1.04, duration: 0.25, yoyo: true, repeat: 1, ease: "power2.out" }, 10.1);
          window.__timelines["s9c-contact"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
