<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s5-root { position: absolute; inset: 0; overflow: hidden; background: #050403; }
        #s5-k { top: 560px; }
        #s5-l1 { top: 830px; }
        #s5-stars { position: absolute; inset: 0; mix-blend-mode: screen; }
        .s5-st { position: absolute; width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px; border-radius: 4px; background: #FFF3DC; box-shadow: 0 0 12px #FFD58A, 0 0 3px #fff; }
      </style>
      <div id="s5-root" data-composition-id="s5-cinema" data-width="1080" data-height="1920">
        <div id="s5-a" class="shot"><div id="s5-ka" class="kb"><video id="s5-va" src="assets/clips/cinema-s.mp4" muted playsinline data-start="1.091" data-duration="3.545"></video></div></div>
        <div class="grad"></div><div class="vig"></div>
        <div id="s5-stars"></div>
        <div id="s5-sw" class="sweep"></div>
        <div id="s5-x3a" class="x3"></div>
        <div id="s5-k" class="kicker">Une salle de</div>
        <div id="s5-x3b" class="x3"></div>
        <div id="s5-l1" class="ln say"><span id="s5-t1">sous un ciel <b>étoilé</b></span></div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // starfield over the footage: deterministic twinkle, flares on "ciel étoilé"
          const host = document.getElementById("s5-stars");
          let seed = 17;
          const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
          for (let i = 0; i < 90; i++) {
            const s = document.createElement("div");
            s.className = "s5-st";
            s.style.left = Math.round(rnd() * 1080) + "px";
            s.style.top = Math.round(rnd() * 1920) + "px";
            host.appendChild(s);
            const sc = 0.4 + rnd() * 1.1;
            tl.fromTo(s, { opacity: 0, scale: sc }, { opacity: 0.3 + rnd() * 0.7, duration: 0.4 + rnd() * 0.6, ease: "sine.inOut", yoyo: true, repeat: 7, immediateRender: true }, rnd() * 0.8);
            tl.to(s, { scale: sc * 1.9, duration: 0.3, ease: "back.out(3)", yoyo: true, repeat: 1 }, 3.45 + rnd() * 0.5);
          }
          tl.fromTo("#s5-stars", { scale: 1.25 }, { scale: 1, duration: 5.3, ease: "power1.out" }, 0);
          HText(tl, document.getElementById("s5-x3a"), "CÔTÉ\nDÉTENTE", 960, 0.2, "outline", { size: 150, hold: 0.5, outAt: 1.05 });
          HShot(tl, "#s5-a", 1.2, "zoom", 0.8);
          HKen(tl, "#s5-ka", 1.2, 3.9, 1.06, 1.18);
          tl.from("#s5-k", { opacity: 0, y: 24, scale: 1.3, duration: 0.6, ease: "expo.out" }, 2.1);
          HText(tl, document.getElementById("s5-x3b"), "CINÉMA", 700, 2.2, "flip", { size: 190, hold: 2.4 });
          HLine(tl, "#s5-t1", 3.45);
          HSheen(tl, "#s5-sw", 3.5);
          tl.to("#s5-ka", { filter: "brightness(2.2) blur(10px)", duration: 0.25, ease: "power2.in" }, 4.9);
          window.__timelines["s5-cinema"] = PDScale(tl, 1 / 1.1);
        })();
      </script>
    </template>
  </body>
</html>
