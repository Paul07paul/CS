<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #bg-root { position: absolute; inset: 0; overflow: hidden; background: radial-gradient(120% 80% at 50% 30%, #1C140A 0%, #0A0806 60%, #050403 100%); }
        #bg-root .blob { position: absolute; border-radius: 50%; filter: blur(160px); }
      </style>
      <div id="bg-root" data-composition-id="bg" data-width="1080" data-height="1920">
        <div id="bg-b1" class="blob" style="left:-300px;top:200px;width:900px;height:900px;background:#C98A2E;opacity:0.3"></div>
        <div id="bg-b2" class="blob" style="left:400px;top:1000px;width:900px;height:900px;background:#7A4A1A;opacity:0.3"></div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#bg-b1", { x: 0, y: 0 }, { x: 300, y: 300, duration: 13.875, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
          tl.fromTo("#bg-b2", { x: 0, y: 0 }, { x: -300, y: -400, duration: 11.1, ease: "sine.inOut", yoyo: true, repeat: 4 }, 0);
          window.__timelines["bg"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
