<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; font-style: normal; font-weight: 100 900; src: url("assets/fonts/montserrat.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #F3F6FD; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #F3F6FD; font-family: "Montserrat", sans-serif; color: #0F1A2B; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .abs { position: absolute; }
      .stage { position: absolute; inset: 0; perspective: 1600px; }
      .p3 { transform-style: preserve-3d; }
      .glass { position: absolute; border-radius: 30px; background: linear-gradient(135deg, rgba(255,255,255,0.8), rgba(255,255,255,0.45)); backdrop-filter: blur(22px) saturate(1.5); border: 1.5px solid rgba(255,255,255,0.95); box-shadow: 0 24px 60px rgba(30,40,110,0.18), inset 0 1px 0 #fff; }
      .chip { position: absolute; height: 80px; border-radius: 40px; padding: 0 32px 0 12px; display: flex; align-items: center; gap: 16px; white-space: nowrap; font-weight: 700; font-size: 29px; color: #0F1A2B; background: linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.6)); backdrop-filter: blur(18px); border: 1.5px solid #fff; box-shadow: 0 16px 40px rgba(30,40,110,0.22); }
      .chip b { font-weight: 800; }
      .chip .ic { width: 56px; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; flex: none; }
      .chip svg { width: 32px; height: 32px; fill: none; stroke: #fff; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .big-chip { height: 104px; border-radius: 52px; font-size: 42px; padding: 0 40px 0 16px; }
      .big-chip .ic { width: 74px; height: 74px; border-radius: 37px; }
      .big-chip svg { width: 42px; height: 42px; }
      .photo { position: absolute; overflow: hidden; }
      .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .card { position: absolute; overflow: hidden; border-radius: 30px; box-shadow: 0 30px 70px rgba(15,26,43,0.3); border: 6px solid rgba(255,255,255,0.92); }
      .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .tag { position: absolute; left: 20px; bottom: 20px; height: 54px; padding: 0 22px; border-radius: 27px; font-weight: 800; font-size: 24px; line-height: 54px; white-space: nowrap; color: #fff; }
      .blob { position: absolute; border-radius: 50%; filter: blur(110px); }
      .tagp { height: 50px; border-radius: 25px; padding: 0 22px; font-weight: 700; font-size: 22px; line-height: 50px; white-space: nowrap; background: rgba(30,107,255,0.1); color: #1E6BFF; }
      #hud .lbl { position: absolute; left: 0; top: 0; white-space: nowrap; }
      .seg { position: absolute; top: 0; width: 64px; height: 8px; border-radius: 4px; background: rgba(15,26,43,0.14); overflow: hidden; }
      .seg i { position: absolute; inset: 0; border-radius: 4px; transform-origin: 0 50%; }
      .wf { position: absolute; border: 2.5px solid rgba(30,107,255,0.95); background: rgba(30,107,255,0.07); box-shadow: 0 0 18px rgba(30,107,255,0.25), inset 0 0 18px rgba(30,107,255,0.12); }
      .wf .win { position: absolute; border: 2px solid rgba(139,92,246,0.85); background: rgba(196,178,255,0.25); }
      .grid { position: absolute; background-image: linear-gradient(rgba(30,107,255,0.22) 2px, transparent 2px), linear-gradient(90deg, rgba(30,107,255,0.22) 2px, transparent 2px); background-size: 80px 80px; -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,0.6) 35%, transparent 68%); mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,0.6) 35%, transparent 68%); }
      .curve span { position: absolute; top: 0; display: block; font-weight: 800; font-size: 128px; line-height: 1; color: #fff; white-space: pre; text-shadow: 0 8px 30px rgba(0,0,0,0.45); }
      .curve span.acc { color: #5EE7FF; }
      .ring { position: absolute; width: 300px; height: 120px; margin: -60px 0 0 -150px; border-radius: 50%; border: 3px solid rgba(140,235,255,0.9); box-shadow: 0 0 24px rgba(94,231,255,0.6); }
      .phone { position: absolute; width: 430px; height: 880px; border-radius: 66px; background: linear-gradient(145deg, #2A3242, #0E1422 40%, #1B2232); padding: 14px; box-shadow: 0 60px 120px rgba(15,26,43,0.35), inset 0 0 0 2px rgba(255,255,255,0.12); }
      .screen { position: absolute; inset: 14px; border-radius: 54px; overflow: hidden; background: #0E1422; }
      .notif { position: absolute; left: 22px; right: 22px; height: 104px; border-radius: 28px; padding: 16px 20px; background: rgba(255,255,255,0.8); backdrop-filter: blur(18px); box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
      .notif .a { font-weight: 800; font-size: 23px; color: #0F1A2B; white-space: nowrap; }
      .notif .b { font-weight: 500; font-size: 21px; color: #3E4C66; white-space: nowrap; margin-top: 6px; }
      .cf { position: absolute; width: 520px; height: 360px; border-radius: 30px; overflow: hidden; box-shadow: 0 30px 70px rgba(15,26,43,0.25); }
      .cf img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .bar { position: absolute; top: -40px; height: 1160px; transform: skewX(-12deg); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="41" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="0" data-duration="41" data-track-index="0" style="position:absolute;inset:0;background:#F3F6FD">
        <div id="b1" class="blob" style="left:-300px;top:-320px;width:1100px;height:1000px;background:#1E6BFF;opacity:0.55"></div>
        <div id="b2" class="blob" style="left:1150px;top:420px;width:1100px;height:1000px;background:#8B5CF6;opacity:0.5"></div>
        <div id="b3" class="blob" style="left:700px;top:-560px;width:900px;height:800px;background:#FF7A59;opacity:0.45"></div>
      </div>
      <div id="s1" class="scene clip" data-start="0" data-duration="3.6" data-track-index="1"></div>
      <div id="s2" class="scene clip" data-start="3.6" data-duration="5.6" data-track-index="2"></div>
      <div id="s3" class="scene clip" data-start="9.2" data-duration="5" data-track-index="1"></div>
      <div id="s4" class="scene clip" data-start="14.2" data-duration="7.3" data-track-index="2"></div>
      <div id="s5" class="scene clip" data-start="21.5" data-duration="5" data-track-index="1"></div>
      <div id="s6" class="scene clip" data-start="26.5" data-duration="5.7" data-track-index="2"></div>
      <div id="s7" class="scene clip" data-start="32.2" data-duration="4.6" data-track-index="1"></div>
      <div id="s8" class="scene clip" data-start="36.8" data-duration="4.2" data-track-index="2"></div>
      <div id="hud" class="clip" data-start="3.6" data-duration="33.2" data-track-index="4" style="position:absolute;left:0;top:0;width:1920px;height:160px;pointer-events:none"></div>
      <div id="shut" class="clip" data-start="3" data-duration="34.3" data-track-index="5" style="position:absolute;inset:0;pointer-events:none;overflow:hidden">
        <div id="shut-g" class="abs" style="left:0;top:0;width:0;height:1080px">
          <div class="bar" style="left:0;width:3000px;background:linear-gradient(100deg,#1E6BFF 0%,#5B7CFF 45%,#8B5CF6 100%)"></div>
          <div class="bar" style="left:3040px;width:520px;background:#8B5CF6"></div>
          <div class="bar" style="left:3600px;width:260px;background:#FF7A59"></div>
        </div>
      </div>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="41" data-track-index="10" data-volume="1"></audio>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const H = (id, html) => ($(id).innerHTML = html);
      const img = (src, st) => `<img src="assets/photos/${src}.jpg" alt="" style="${st || ""}" />`;
      const ICONS = {
        wifi: '<path d="M6 19 a26 26 0 0 1 36 0 M12 26 a17 17 0 0 1 24 0 M18 33 a8 8 0 0 1 12 0"/><circle cx="24" cy="39" r="2.4" fill="#fff"/>',
        park: '<rect x="9" y="7" width="30" height="34" rx="6"/><path d="M19 33 V16 h7 a6 6 0 0 1 0 12 h-7"/>',
        bolt: '<path d="M27 4 L10 27 h12 l-3 17 L38 20 H26 z"/>',
        wash: '<rect x="8" y="5" width="32" height="38" rx="4"/><circle cx="24" cy="26" r="9"/><path d="M13 11 h6"/>',
        star: '<path d="M24 5 l5.6 12 13 1.4 -9.8 8.8 2.8 12.8 L24 33.4 12.4 40 15.2 27.2 5.4 18.4 18.4 17 z"/>',
        bed: '<path d="M5 38 V12 M5 28 h38 v10 M5 22 h14 a4 4 0 0 1 4 4 v2 M23 22 h14 a6 6 0 0 1 6 6"/>',
        bunk: '<path d="M8 6 v36 M40 6 v36 M8 16 h32 M8 32 h32"/><path d="M12 13 h10 M12 29 h10"/>',
        drop: '<path d="M24 5 C17 15 11 22 11 29 a13 13 0 0 0 26 0 C37 22 31 15 24 5 z"/>',
        people: '<circle cx="17" cy="16" r="6"/><circle cx="33" cy="18" r="5"/><path d="M5 40 c0 -8 6 -13 12 -13 s12 5 12 13 M29 40 c0 -6 4 -10 9 -10 s7 4 7 10"/>',
        pool: '<path d="M16 32 V11 a4 4 0 0 1 8 0 M28 32 V11 a4 4 0 0 1 8 0 M16 18 h12 M16 25 h12"/><path d="M4 39 c4 -3 8 3 12 0 s8 3 12 0 s8 3 12 0 s4 3 6 0"/>',
        sauna: '<path d="M18 8 a4 4 0 0 1 8 0 v19 a8 8 0 1 1 -8 0 z"/><path d="M22 30 V18"/><path d="M33 12 c-3 3 3 5 0 8 M40 12 c-3 3 3 5 0 8"/>',
        crown: '<path d="M6 36 L9 14 L18 24 L24 10 L30 24 L39 14 L42 36 Z"/><path d="M8 42 h32"/>',
        ski: '<path d="M6 40 L42 14"/><path d="M14 44 L44 22"/><circle cx="30" cy="9" r="4"/>',
      };
      const COL = { blue: "linear-gradient(135deg,#3B82FF,#1E5BFF)", violet: "linear-gradient(135deg,#A78BFA,#7C3AED)", coral: "linear-gradient(135deg,#FF9A6B,#FF5A5F)", pink: "linear-gradient(135deg,#F472B6,#DB2777)", cyan: "linear-gradient(135deg,#22D3EE,#0EA5E9)", mint: "linear-gradient(135deg,#34D399,#059669)", amber: "linear-gradient(135deg,#FBBF24,#F97316)" };
      const chip = (id, x, y, icon, html, col, big) => `<div class="chip ${big ? "big-chip" : ""}" id="${id}" style="left:${x}px;top:${y}px"><div class="ic" style="background:${COL[col || "blue"]}"><svg viewBox="0 0 48 48">${ICONS[icon]}</svg></div><span>${html}</span></div>`;

      // ---------- HUD: chapter label + progress ----------
      const CH = [["Le chalet", "#1E6BFF"], ["Les chambres", "#8B5CF6"], ["Pièces de vie", "#F97316"], ["Bien-être", "#0EA5E9"], ["Équipements", "#059669"], ["Réservation", "#FF385C"]];
      H("hud", `<div class="glass" style="left:64px;top:52px;width:430px;height:64px;border-radius:32px">
          <div class="abs" style="left:22px;top:20px;width:24px;height:24px;border-radius:12px;overflow:hidden">${CH.map((c, k) => `<div id="hud-d${k}" class="abs" style="inset:0;background:${c[1]}"></div>`).join("")}</div>
          <div class="abs" style="left:62px;top:0;height:64px;width:340px;overflow:hidden">${CH.map((c, k) => `<div id="hud-l${k}" class="lbl" style="top:0;line-height:64px;font-weight:800;font-size:22px;letter-spacing:0.2em;text-transform:uppercase"><span style="color:${c[1]}">0${k + 1}</span>&nbsp;&nbsp;${c[0]}</div>`).join("")}</div>
        </div>
        <div class="glass" style="left:1400px;top:64px;width:456px;height:40px;border-radius:20px">${CH.map((c, k) => `<div class="seg" style="left:${20 + k * 72}px;top:16px"><i id="hud-s${k}" style="background:${c[1]}"></i></div>`).join("")}</div>`);

      // ---------- S1: wireframe plan + glass title ----------
      const W = 560, D = 420, HW = 230, R = 170, L = Math.hypot(W / 2, R) + 26, A = (Math.atan2(R, W / 2) * 180) / Math.PI;
      const gable = (z, id) => `<svg id="${id}" class="abs" style="left:${-W / 2}px;top:${-HW - R}px;width:${W}px;height:${R + 2}px;overflow:visible;transform:translateZ(${z}px)" viewBox="0 0 ${W} ${R + 2}"><polygon points="0,${R} ${W / 2},2 ${W},${R}" fill="rgba(30,107,255,0.1)" stroke="rgba(30,107,255,0.95)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${W / 2}" cy="${R * 0.6}" r="26" fill="rgba(196,178,255,0.3)" stroke="rgba(139,92,246,0.9)" stroke-width="2"/></svg>`;
      const wins = (n, w, top, h, door) => Array.from({ length: n }, (_, k) => `<div class="win" style="left:${((k + 0.5) * w) / n - 34}px;top:${top}px;width:68px;height:${h}px"></div>`).join("") + (door ? `<div class="win" style="left:${w / 2 - 40}px;top:${HW - 140}px;width:80px;height:137px;border-bottom:none"></div>` : "");
      const roof = (id, sx) => `<div class="wf" id="${id}" style="left:${-L / 2}px;top:${-(D + 60) / 2}px;width:${L}px;height:${D + 60}px;transform:translate3d(${(sx * W) / 4}px,${-(HW + R / 2)}px,0) rotateZ(${sx * A}deg) rotateX(90deg);background:repeating-linear-gradient(90deg,rgba(30,107,255,0.3) 0 2px,rgba(30,107,255,0.1) 2px 46px)"></div>`;
      H("s1", `<div class="stage" style="perspective:1500px"><div id="s1-cam" class="abs p3" style="left:960px;top:600px;width:0;height:0"><div id="s1-house" class="abs p3" style="left:0;top:0;width:0;height:0">
          <div class="grid" id="s1-grid" style="left:-800px;top:-800px;width:1600px;height:1600px;transform:rotateX(90deg)"></div>
          <div class="wf" id="s1-f0" style="left:${-W / 2}px;top:${-HW}px;width:${W}px;height:${HW}px;transform:translateZ(${D / 2}px)">${wins(3, W, 40, 70, true)}</div>
          <div class="wf" id="s1-f1" style="left:${-W / 2}px;top:${-HW}px;width:${W}px;height:${HW}px;transform:translateZ(${-D / 2}px) rotateY(180deg)">${wins(3, W, 40, 70)}</div>
          <div class="wf" id="s1-f2" style="left:${-D / 2}px;top:${-HW}px;width:${D}px;height:${HW}px;transform:rotateY(-90deg) translateZ(${W / 2}px)">${wins(2, D, 50, 110)}</div>
          <div class="wf" id="s1-f3" style="left:${-D / 2}px;top:${-HW}px;width:${D}px;height:${HW}px;transform:rotateY(90deg) translateZ(${W / 2}px)">${wins(2, D, 50, 110)}</div>
          ${gable(D / 2, "s1-g0")}${gable(-D / 2, "s1-g1")}${roof("s1-r0", 1)}${roof("s1-r1", -1)}
          <div class="wf" id="s1-ch" style="left:-30px;top:-60px;width:60px;height:120px;transform:translate3d(160px,-350px,60px)"></div>
        </div></div></div>
        <div id="s1-ic" class="glass" style="left:960px;top:880px;width:150px;height:150px;border-radius:44px;overflow:hidden">
          <div id="s1-word" class="abs" style="left:50%;top:50%;font-weight:800;font-size:70px;letter-spacing:0.05em;color:#0F1A2B;white-space:nowrap">${"MORIOND".split("").map((c, k) => `<span id="s1-l${k}" style="display:inline-block;overflow:hidden;vertical-align:top">${c}</span>`).join("")}</div>
          <div id="s1-sub" class="abs" style="left:50%;top:50%;font-weight:800;font-size:22px;letter-spacing:0.55em;white-space:nowrap;background:linear-gradient(90deg,#1E6BFF,#8B5CF6,#FF7A59);-webkit-background-clip:text;background-clip:text;color:transparent">COURCHEVEL</div>
        </div>`);

      // ---------- S2: balcony -> wall of every room -> dive ----------
      const G = 60, TW = 1920, TH = 1080;
      const WALL = [["w01", "w03", "w02", "w15"], ["w04", "w14", "w05", "w09"], ["w06", "w08", "w07", "x16"], ["w10", "w11", "w12", "w13"]];
      H("s2", `<div class="abs" style="inset:0;background:linear-gradient(135deg,#1E3A8A,#5B21B6 55%,#BE185D)"></div>
        <div id="s2-tilt" class="stage p3" style="perspective:2200px"><div id="s2-wall" class="abs" style="left:0;top:0;width:${4 * TW + 3 * G}px;height:${4 * TH + 3 * G}px;transform-origin:0 0">
          ${WALL.map((r, i) => r.map((s, j) => `<div class="photo" style="left:${j * (TW + G)}px;top:${i * (TH + G)}px;width:${TW}px;height:${TH}px;border-radius:${s === "w14" || s === "w04" ? 0 : 40}px">${img(s)}</div>`).join("")).join("")}
        </div></div>
        ${chip("s2-c0", 110, 700, "crown", "Chalet de <b>prestige</b>", "amber")}
        ${chip("s2-c1", 110, 800, "people", "<b>12</b> voyageurs", "violet")}
        ${chip("s2-c2", 110, 900, "ski", "Au pied des <b>pistes</b>", "cyan")}`);

      // ---------- S3: 4 suites -> dortoir -> bathrooms ----------
      const SUITES = ["w04", "w05", "w06", "w07"], SCOL = ["violet", "pink", "blue", "coral"];
      const BATH = ["w09", "w11", "w12", "w13"];
      H("s3", `<div id="s3-dorm" class="photo" style="inset:0">${img("w08").replace("<img", '<img id="s3-dimg"')}</div>
        <div class="stage" style="perspective:2000px">${SUITES.map((s, k) => `<div id="s3-p${k}" class="photo" style="left:${k * 480}px;top:0;width:480px;height:1080px;transform-origin:0% 50%">${img(s).replace("<img", `<img id="s3-pi${k}"`)}<div class="abs" style="left:0;right:0;bottom:0;height:300px;background:linear-gradient(180deg,rgba(15,26,43,0),rgba(15,26,43,0.55))"></div><div id="s3-t${k}" class="tag" style="left:150px;bottom:44px;background:${COL[SCOL[k]]}">Suite ${k + 1}</div></div>`).join("")}</div>
        <div id="s3-full" class="photo" style="inset:0">${img("w04")}</div>
        <div id="s3-fan" class="stage p3" style="perspective:1800px">${BATH.map((s, k) => `<div id="s3-b${k}" class="card" style="left:${190 + k * 340}px;top:300px;width:520px;height:680px">${img(s)}</div>`).join("")}</div>
        ${chip("s3-c0", 760, 150, "bed", "<b>4</b> suites", "violet", true)}
        ${chip("s3-c1", 740, 150, "bunk", "<b>1</b> dortoir", "pink", true)}
        ${chip("s3-c2", 640, 96, "drop", "<b>4</b> salles d'eau", "cyan", true)}`);

      // ---------- S4: living spaces + rating ----------
      H("s4", `<div class="photo" style="inset:0;opacity:0.5" id="s4-bgp"><img src="assets/photos/w01.jpg" alt="" style="filter:blur(40px) saturate(1.3);transform:scale(1.2)" /></div>
        <div class="stage" style="perspective:1700px">
          <div id="s4-k" class="card p3" style="left:30px;top:600px;width:640px;height:400px">${img("w02")}<div class="tag" style="background:${COL.amber}">Cuisine équipée</div></div>
          <div id="s4-d" class="card p3" style="left:1210px;top:180px;width:640px;height:400px">${img("w03")}<div class="tag" style="background:${COL.coral}">Salle à manger</div></div>
          <div id="s4-card" class="abs p3" style="left:420px;top:190px;width:1080px;height:700px">
            <div class="glass" style="inset:0;border-radius:40px;overflow:hidden">
              <div class="photo" style="left:18px;top:18px;right:18px;height:520px;border-radius:28px"><img id="s4-img" src="assets/photos/w01.jpg" alt="" /></div>
              <div class="abs" style="left:44px;top:566px;font-weight:800;font-size:44px;white-space:nowrap">Salon panoramique</div>
              <div class="abs" style="left:44px;top:625px;font-weight:500;font-size:25px;color:#4A5875;white-space:nowrap">Baigné de lumière · face aux sommets</div>
              <div class="tagp abs" style="right:40px;top:590px;background:linear-gradient(135deg,#FBBF24,#F97316);color:#fff">Vue sommets</div>
            </div>
          </div>
          <div id="s4-rate" class="abs p3" style="left:1300px;top:250px;width:480px;height:540px">
            <div class="glass" style="inset:0;border-radius:40px">
              <div class="abs" style="left:46px;top:46px;font-weight:700;font-size:22px;letter-spacing:0.22em;color:#4A5875">NOTE VOYAGEURS</div>
              <div class="abs" style="left:40px;top:96px;font-weight:800;font-size:170px;line-height:1;letter-spacing:-0.04em;font-variant-numeric:tabular-nums;color:#F2562E" id="s4-num">0,00</div>
              <div class="abs" style="left:46px;top:300px;display:flex;gap:12px">${[0, 1, 2, 3, 4].map((k) => `<svg id="s4-s${k}" viewBox="0 0 48 48" style="width:62px;height:62px;fill:#FBBF24;stroke:#F97316;stroke-width:2;stroke-linejoin:round">${ICONS.star}</svg>`).join("")}</div>
              <div class="abs" style="left:46px;top:400px;font-weight:700;font-size:32px;white-space:nowrap"><span style="color:#F97316">168</span> évaluations</div>
              <div class="abs" style="left:46px;top:448px;font-weight:500;font-size:24px;color:#4A5875;white-space:nowrap">sur 5 · Airbnb</div>
            </div>
          </div>
        </div>`);

      // ---------- S5: pool (fully visible) + sauna ----------
      const word = "piscine & sauna".split("");
      const cw = word.map((c) => (c === " " ? 40 : c === "&" ? 96 : c === "i" ? 40 : 80));
      const tot = cw.reduce((a, b) => a + b, 0);
      let acc = 0;
