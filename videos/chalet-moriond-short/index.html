<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Cormorant Garamond"; font-style: italic; font-weight: 400 600; src: url("assets/fonts/cormorant-italic.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-style: normal; font-weight: 100 900; src: url("assets/fonts/montserrat.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0B0F18; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0B0F18; font-family: "Montserrat", sans-serif; color: #0F1A2B; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .abs { position: absolute; }
      .stage { position: absolute; inset: 0; perspective: 1600px; }
      .p3 { transform-style: preserve-3d; }
      .glass { position: absolute; border-radius: 30px; background: linear-gradient(135deg, rgba(255,255,255,0.78), rgba(255,255,255,0.42)); backdrop-filter: blur(22px) saturate(1.4); border: 1.5px solid rgba(255,255,255,0.9); box-shadow: 0 24px 60px rgba(30,60,120,0.16), inset 0 1px 0 #fff; }
      .chip { position: absolute; height: 76px; border-radius: 38px; padding: 0 30px 0 22px; display: flex; align-items: center; gap: 14px; white-space: nowrap; font-weight: 700; font-size: 28px; color: #0F1A2B; background: linear-gradient(135deg, rgba(255,255,255,0.86), rgba(255,255,255,0.5)); backdrop-filter: blur(18px); border: 1.5px solid #fff; box-shadow: 0 16px 40px rgba(30,60,120,0.18); }
      .chip b { color: #1E6BFF; font-weight: 800; }
      .chip svg { width: 34px; height: 34px; flex: none; fill: none; stroke: #1E6BFF; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .kicker { position: absolute; left: 72px; top: 60px; height: 56px; border-radius: 28px; padding: 0 26px 0 20px; display: flex; align-items: center; gap: 12px; font-weight: 700; font-size: 22px; letter-spacing: 0.22em; text-transform: uppercase; white-space: nowrap; color: #0F1A2B; background: rgba(255,255,255,0.7); backdrop-filter: blur(16px); border: 1.5px solid #fff; box-shadow: 0 10px 30px rgba(30,60,120,0.12); }
      .kicker i { width: 12px; height: 12px; border-radius: 6px; background: #1E6BFF; box-shadow: 0 0 12px #1E6BFF; }
      .photo { position: absolute; overflow: hidden; }
      .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .blob { position: absolute; border-radius: 50%; }
      #flash { position: absolute; inset: 0; background: #FFFFFF; pointer-events: none; opacity: 0; }
      /* s2 */
      .row { position: absolute; left: 0; width: 1000px; height: 118px; border-radius: 28px; display: flex; align-items: center; padding: 0 28px 0 14px; gap: 24px; }
      .row .th { width: 90px; height: 90px; border-radius: 20px; overflow: hidden; position: relative; flex: none; }
      .row .th img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .row .tx { flex: 1; }
      .row .t1 { font-weight: 800; font-size: 32px; line-height: 1.15; }
      .row .t2 { font-weight: 500; font-size: 23px; color: #4A5875; line-height: 1.3; }
      .tagp { height: 50px; border-radius: 25px; padding: 0 22px; font-weight: 700; font-size: 22px; line-height: 50px; white-space: nowrap; background: rgba(30,107,255,0.1); color: #1E6BFF; }
      /* s3 wireframe */
      .wf { position: absolute; border: 2.5px solid rgba(30,107,255,0.95); background: rgba(30,107,255,0.06); box-shadow: 0 0 18px rgba(30,107,255,0.25), inset 0 0 18px rgba(30,107,255,0.12); backface-visibility: visible; }
      .wf .win { position: absolute; border: 2px solid rgba(30,107,255,0.8); background: rgba(160,200,255,0.18); }
      .grid { position: absolute; background-image: linear-gradient(rgba(30,107,255,0.22) 2px, transparent 2px), linear-gradient(90deg, rgba(30,107,255,0.22) 2px, transparent 2px); background-size: 80px 80px; -webkit-mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,0.6) 35%, transparent 68%); mask-image: radial-gradient(circle, #000 0%, rgba(0,0,0,0.6) 35%, transparent 68%); }
      .big { font-weight: 800; font-size: 44px; color: #1E6BFF; }
      /* s5 */
      .curve span { position: absolute; top: 0; display: block; font-weight: 800; font-size: 128px; line-height: 1; color: #0F1A2B; white-space: pre; transform-origin: 50% 100%; }
      .curve span.acc { color: #1E6BFF; }
      /* s6 phone */
      .phone { position: absolute; width: 430px; height: 880px; border-radius: 66px; background: linear-gradient(145deg, #2A3242, #0E1422 40%, #1B2232); padding: 14px; box-shadow: 0 60px 120px rgba(15,26,43,0.35), inset 0 0 0 2px rgba(255,255,255,0.12); }
      .screen { position: absolute; inset: 14px; border-radius: 54px; overflow: hidden; background: #0E1422; }
      .notif { position: absolute; left: 22px; right: 22px; height: 104px; border-radius: 28px; padding: 16px 20px; background: rgba(255,255,255,0.78); backdrop-filter: blur(18px); box-shadow: 0 10px 30px rgba(0,0,0,0.25); }
      .notif .a { font-weight: 800; font-size: 23px; color: #0F1A2B; white-space: nowrap; }
      .notif .b { font-weight: 500; font-size: 21px; color: #3E4C66; white-space: nowrap; margin-top: 6px; }
      /* s7 */
      .cf { position: absolute; width: 520px; height: 360px; border-radius: 30px; overflow: hidden; box-shadow: 0 30px 70px rgba(15,26,43,0.25); }
      .cf img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="41" data-width="1920" data-height="1080">
      <div id="bg" class="clip" data-start="3.3" data-duration="37.7" data-track-index="0" style="position:absolute;inset:0;background:linear-gradient(160deg,#F6F8FD 0%,#E6EDF9 55%,#EEE9FB 100%)">
        <div id="b1" class="blob" style="left:-260px;top:-300px;width:1100px;height:1100px;background:radial-gradient(circle,rgba(120,165,255,0.55) 0%,rgba(120,165,255,0) 65%)"></div>
        <div id="b2" class="blob" style="left:1100px;top:380px;width:1200px;height:1200px;background:radial-gradient(circle,rgba(196,178,255,0.5) 0%,rgba(196,178,255,0) 65%)"></div>
        <div id="b3" class="blob" style="left:640px;top:-520px;width:900px;height:900px;background:radial-gradient(circle,rgba(255,214,190,0.55) 0%,rgba(255,214,190,0) 65%)"></div>
      </div>
      <div id="s1" class="scene clip" data-start="0" data-duration="3.6" data-track-index="1"></div>
      <div id="s2" class="scene clip" data-start="3.6" data-duration="5.6" data-track-index="2"></div>
      <div id="s3" class="scene clip" data-start="9.2" data-duration="5" data-track-index="1"></div>
      <div id="s4" class="scene clip" data-start="14.2" data-duration="7.3" data-track-index="2"></div>
      <div id="s5" class="scene clip" data-start="21.5" data-duration="5" data-track-index="1"></div>
      <div id="s6" class="scene clip" data-start="26.5" data-duration="5.7" data-track-index="2"></div>
      <div id="s7" class="scene clip" data-start="32.2" data-duration="4.6" data-track-index="1"></div>
      <div id="s8" class="scene clip" data-start="36.8" data-duration="4.2" data-track-index="2"></div>
      <div id="flash" class="clip" data-start="0" data-duration="41" data-track-index="3"></div>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="41" data-track-index="10" data-volume="1"></audio>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const H = (id, html) => ($(id).innerHTML = html);
      const img = (src) => `<img src="assets/photos/${src}.jpg" alt="" />`;
      const ICONS = {
        wifi: '<path d="M6 19 a26 26 0 0 1 36 0 M12 26 a17 17 0 0 1 24 0 M18 33 a8 8 0 0 1 12 0"/><circle cx="24" cy="39" r="2.4" fill="#1E6BFF"/>',
        park: '<rect x="9" y="7" width="30" height="34" rx="6"/><path d="M19 33 V16 h7 a6 6 0 0 1 0 12 h-7"/>',
        bolt: '<path d="M27 4 L10 27 h12 l-3 17 L38 20 H26 z"/>',
        wash: '<rect x="8" y="5" width="32" height="38" rx="4"/><circle cx="24" cy="26" r="9"/><path d="M13 11 h6"/>',
        star: '<path d="M24 5 l5.6 12 13 1.4 -9.8 8.8 2.8 12.8 L24 33.4 12.4 40 15.2 27.2 5.4 18.4 18.4 17 z"/>',
        bed: '<path d="M5 38 V12 M5 28 h38 v10 M5 22 h14 a4 4 0 0 1 4 4 v2 M23 22 h14 a6 6 0 0 1 6 6"/>',
        bunk: '<path d="M8 6 v36 M40 6 v36 M8 16 h32 M8 32 h32"/><path d="M12 13 h10 M12 29 h10"/>',
        drop: '<path d="M24 5 C17 15 11 22 11 29 a13 13 0 0 0 26 0 C37 22 31 15 24 5 z"/>',
        people: '<circle cx="17" cy="16" r="6"/><circle cx="33" cy="18" r="5"/><path d="M5 40 c0 -8 6 -13 12 -13 s12 5 12 13 M29 40 c0 -6 4 -10 9 -10 s7 4 7 10"/>',
        pool: '<path d="M16 32 V11 a4 4 0 0 1 8 0 M28 32 V11 a4 4 0 0 1 8 0 M16 18 h12 M16 25 h12"/><path d="M4 39 c4 -3 8 3 12 0 s8 3 12 0 s8 3 12 0 s4 3 6 0"/>',
        sauna: '<path d="M18 8 a4 4 0 0 1 8 0 v19 a8 8 0 1 1 -8 0 z"/><path d="M22 30 V18"/><path d="M33 12 c-3 3 3 5 0 8 M40 12 c-3 3 3 5 0 8"/>',
        search: '<circle cx="20" cy="20" r="12"/><path d="M29 29 l12 12"/>',
        check: '<path d="M10 25 l9 9 l19 -20"/>',
      };
      const svg = (n) => `<svg viewBox="0 0 48 48">${ICONS[n]}</svg>`;
      const chip = (id, x, y, icon, html) => `<div class="chip" id="${id}" style="left:${x}px;top:${y}px">${svg(icon)}<span>${html}</span></div>`;
      const kicker = (id, txt) => `<div class="kicker" id="${id}"><i></i>${txt}</div>`;

      // ---------- S1: glass icon morph ----------
      H("s1", `<div class="abs" style="inset:0;background:radial-gradient(circle at 50% 50%,#17223A 0%,#0B0F18 60%)"></div>
        <div id="s1-ic" class="abs" style="left:960px;top:540px;width:220px;height:220px;border-radius:56px;background:linear-gradient(145deg,rgba(255,255,255,0.16),rgba(255,255,255,0.04));border:2px solid rgba(255,255,255,0.35);box-shadow:0 0 0 6px rgba(30,107,255,0.18),0 0 80px rgba(30,107,255,0.35),inset 0 1px 0 rgba(255,255,255,0.5);overflow:hidden">
          <div id="s1-word" class="abs" style="left:50%;top:50%;font-weight:800;font-size:76px;letter-spacing:0.04em;color:#fff;white-space:nowrap">${"MORIOND".split("").map((c, k) => `<span id="s1-l${k}" style="display:inline-block;overflow:hidden;vertical-align:top">${c}</span>`).join("")}</div>
          <div id="s1-sub" class="abs" style="left:50%;top:50%;font-weight:700;font-size:24px;letter-spacing:0.5em;color:#6FA0FF;white-space:nowrap">COURCHEVEL</div>
        </div>`);

      // ---------- S2: search + result cards ----------
      const rows = [
        ["w03", "Chalet Moriond", "Courchevel · 12 voyageurs", "Coup de cœur"],
        ["w01", "Salon panoramique", "Vue sur les sommets", "★ 4,74"],
        ["w05", "4 suites", "Chacune avec sa salle d'eau", "Confort"],
        ["w15", "Piscine &amp; sauna", "Espace bien-être privé", "Privé"],
      ];
      H("s2", `<div class="stage"><div id="s2-ui" class="abs p3" style="left:460px;top:150px;width:1000px;height:820px">
          <div class="glass" id="s2-bar" style="left:0;top:0;width:1000px;height:96px;border-radius:48px;display:flex;align-items:center;padding:0 16px 0 30px;gap:18px">
            <svg viewBox="0 0 48 48" style="width:36px;height:36px;fill:none;stroke:#0F1A2B;stroke-width:3.4;stroke-linecap:round">${ICONS.search}</svg>
            <div style="flex:1;font-weight:600;font-size:30px;white-space:nowrap;overflow:hidden"><span id="s2-type"></span><span id="s2-caret" style="display:inline-block;width:3px;height:34px;background:#1E6BFF;vertical-align:-6px;margin-left:3px"></span></div>
            <div style="height:64px;border-radius:32px;padding:0 28px;background:#0F1A2B;color:#fff;font-weight:700;font-size:23px;line-height:64px;white-space:nowrap">Rechercher</div>
          </div>
          ${rows.map((r, i) => `<div class="row glass" id="s2-r${i}" style="top:${130 + i * 136}px;${i === 0 ? "border:2.5px solid #1E6BFF;box-shadow:0 24px 60px rgba(30,107,255,0.28),inset 0 1px 0 #fff" : ""}"><div class="th">${img(r[0])}</div><div class="tx"><div class="t1">${r[1]}</div><div class="t2">${r[2]}</div></div><div class="tagp" style="${i === 0 ? "background:#1E6BFF;color:#fff" : ""}">${r[3]}</div></div>`).join("")}
          <div id="s2-btn" class="abs" style="left:340px;top:690px;width:320px;height:80px;border-radius:40px;background:#0F1A2B;color:#fff;font-weight:700;font-size:27px;line-height:80px;text-align:center;box-shadow:0 18px 40px rgba(15,26,43,0.3)">Voir le chalet →</div>
        </div></div>`);

      // ---------- S3: 3D wireframe chalet ----------
      const W = 560, D = 420, HW = 230, R = 170, L = Math.hypot(W / 2, R) + 26, A = (Math.atan2(R, W / 2) * 180) / Math.PI;
      const gable = (z, id) => `<svg id="${id}" class="abs" style="left:${-W / 2}px;top:${-HW - R}px;width:${W}px;height:${R + 2}px;overflow:visible;transform:translateZ(${z}px)" viewBox="0 0 ${W} ${R + 2}"><polygon points="0,${R} ${W / 2},2 ${W},${R}" fill="rgba(30,107,255,0.1)" stroke="rgba(30,107,255,0.95)" stroke-width="2.5" stroke-linejoin="round"/><circle cx="${W / 2}" cy="${R * 0.6}" r="26" fill="rgba(160,200,255,0.2)" stroke="rgba(30,107,255,0.8)" stroke-width="2"/></svg>`;
      const wins = (n, w, top, h, door) => Array.from({ length: n }, (_, k) => `<div class="win" style="left:${((k + 0.5) * w) / n - 34}px;top:${top}px;width:68px;height:${h}px"></div>`).join("") + (door ? `<div class="win" style="left:${w / 2 - 40}px;top:${HW - 140}px;width:80px;height:137px;border-bottom:none"></div>` : "");
      H("s3", `${kicker("s3-k", "Le chalet · plan 3D")}
        <div class="stage" style="perspective:1500px"><div id="s3-cam" class="abs p3" style="left:960px;top:640px;width:0;height:0"><div id="s3-house" class="abs p3" style="left:0;top:0;width:0;height:0">
          <div class="grid" id="s3-grid" style="left:-800px;top:-800px;width:1600px;height:1600px;transform:rotateX(90deg)"></div>
          <div class="wf" id="s3-f0" style="left:${-W / 2}px;top:${-HW}px;width:${W}px;height:${HW}px;transform:translateZ(${D / 2}px)">${wins(3, W, 40, 70, true)}</div>
          <div class="wf" id="s3-f1" style="left:${-W / 2}px;top:${-HW}px;width:${W}px;height:${HW}px;transform:translateZ(${-D / 2}px) rotateY(180deg)">${wins(3, W, 40, 70)}</div>
          <div class="wf" id="s3-f2" style="left:${-D / 2}px;top:${-HW}px;width:${D}px;height:${HW}px;transform:rotateY(-90deg) translateZ(${W / 2}px)">${wins(2, D, 50, 110)}</div>
          <div class="wf" id="s3-f3" style="left:${-D / 2}px;top:${-HW}px;width:${D}px;height:${HW}px;transform:rotateY(90deg) translateZ(${W / 2}px)">${wins(2, D, 50, 110)}</div>
          ${gable(D / 2, "s3-g0")}
          ${gable(-D / 2, "s3-g1")}
          <div class="wf" id="s3-r0" style="left:${-L / 2}px;top:${-(D + 60) / 2}px;width:${L}px;height:${D + 60}px;transform:translate3d(${W / 4}px,${-(HW + R / 2)}px,0) rotateZ(${A}deg) rotateX(90deg);background:repeating-linear-gradient(90deg,rgba(30,107,255,0.3) 0 2px,rgba(30,107,255,0.1) 2px 46px)"></div>
          <div class="wf" id="s3-r1" style="left:${-L / 2}px;top:${-(D + 60) / 2}px;width:${L}px;height:${D + 60}px;transform:translate3d(${-W / 4}px,${-(HW + R / 2)}px,0) rotateZ(${-A}deg) rotateX(90deg);background:repeating-linear-gradient(90deg,rgba(30,107,255,0.3) 0 2px,rgba(30,107,255,0.1) 2px 46px)"></div>
          <div class="wf" id="s3-ch" style="left:-30px;top:-60px;width:60px;height:120px;transform:translate3d(160px,-350px,60px)"></div>
        </div></div></div>
        ${chip("s3-c0", 150, 270, "bed", "<b>4</b> suites")}
        ${chip("s3-c1", 1440, 250, "bunk", "<b>1</b> dortoir")}
        ${chip("s3-c2", 120, 760, "drop", "<b>4</b> salles d'eau")}
        ${chip("s3-c3", 1400, 780, "people", "<b>12</b> voyageurs")}`);

      // ---------- S4: salon card 3D + rating ----------
      H("s4", `<div class="photo" style="inset:0;opacity:0.55" id="s4-bgp"><img src="assets/photos/w01.jpg" alt="" style="filter:blur(40px) saturate(1.2);transform:scale(1.2)" /></div>
        <div class="abs" style="inset:0;background:linear-gradient(160deg,rgba(246,248,253,0.65),rgba(230,237,249,0.55))"></div>
        ${kicker("s4-k", "Le salon")}
        <div class="stage" style="perspective:1700px">
          <div id="s4-card" class="abs p3" style="left:150px;top:170px;width:1080px;height:700px">
            <div class="glass" style="inset:0;border-radius:40px;overflow:hidden;padding:18px">
              <div class="photo" style="left:18px;top:18px;right:18px;height:520px;border-radius:28px"><img id="s4-img" src="assets/photos/w01.jpg" alt="" /></div>
              <div class="abs" style="left:44px;top:566px;font-weight:800;font-size:44px;white-space:nowrap">Salon panoramique</div>
              <div class="abs" style="left:44px;top:625px;font-weight:500;font-size:25px;color:#4A5875;white-space:nowrap">Baigné de lumière · face aux sommets</div>
              <div class="tagp abs" style="right:40px;top:590px;background:#1E6BFF;color:#fff">Vue sommets</div>
            </div>
          </div>
          <div id="s4-rate" class="abs p3" style="left:1300px;top:250px;width:480px;height:540px">
            <div class="glass" style="inset:0;border-radius:40px">
              <div class="abs" style="left:46px;top:46px;font-weight:700;font-size:22px;letter-spacing:0.22em;color:#4A5875">NOTE VOYAGEURS</div>
              <div class="abs" style="left:40px;top:96px;font-weight:800;font-size:170px;line-height:1;letter-spacing:-0.04em;color:#0F1A2B;font-variant-numeric:tabular-nums" id="s4-num">0,00</div>
              <div class="abs" style="left:46px;top:300px;display:flex;gap:12px">${[0, 1, 2, 3, 4].map((k) => `<svg id="s4-s${k}" viewBox="0 0 48 48" style="width:62px;height:62px;fill:#1E6BFF;stroke:#1E6BFF;stroke-width:2;stroke-linejoin:round">${ICONS.star}</svg>`).join("")}</div>
              <div class="abs" style="left:46px;top:400px;font-weight:700;font-size:32px;white-space:nowrap"><span style="color:#1E6BFF">168</span> évaluations</div>
              <div class="abs" style="left:46px;top:448px;font-weight:500;font-size:24px;color:#4A5875;white-space:nowrap">sur 5 · Airbnb</div>
            </div>
          </div>
        </div>`);

      // ---------- S5: pool, lateral tracking + curved title ----------
      const word = "piscine & sauna".split("");
      const cw = word.map((c) => (c === " " ? 40 : c === "&" ? 96 : c === "i" ? 40 : c === "m" ? 116 : 80));
      const tot = cw.reduce((a, b) => a + b, 0);
      let acc = 0;
      const letters = word.map((c, k) => {
        const x = acc + cw[k] / 2; acc += cw[k];
        const u = x / tot, y = -70 * Math.sin(Math.PI * u), rot = (-Math.atan((70 * Math.PI * Math.cos(Math.PI * u)) / tot) * 180) / Math.PI;
        return `<span id="s5-l${k}" class="${k >= 10 ? "acc" : ""}" style="left:${x - cw[k] / 2}px;width:${cw[k]}px;text-align:center"><span style="position:relative;display:block;transform:translateY(${y}px) rotate(${rot}deg)">${c}</span></span>`;
      }).join("");
      H("s5", `<div id="s5-ph" class="photo" style="inset:0">${img("w15").replace("<img", '<img id="s5-img"')}</div>
        <div class="abs" style="left:0;right:0;bottom:0;height:560px;background:linear-gradient(180deg,rgba(240,244,251,0) 0%,rgba(240,244,251,0.82) 55%,rgba(240,244,251,0.96) 100%)"></div>
        ${kicker("s5-k", "Bien-être")}
        <div id="s5-curve" class="curve abs" style="left:${960 - tot / 2}px;top:820px;width:${tot}px;height:140px">${letters}</div>
        ${chip("s5-c0", 1290, 150, "pool", "Piscine <b>intérieure</b>")}
        ${chip("s5-c1", 1360, 250, "sauna", "Sauna <b>privé</b>")}`);

      // ---------- S6: 3D phone + floating chips ----------
      H("s6", `${kicker("s6-k", "Tout inclus")}
        <div class="stage" style="perspective:1800px"><div id="s6-ph" class="phone p3" style="left:745px;top:100px">
          <div class="screen">
            <div class="photo" style="inset:0">${img("w14")}</div>
            <div class="abs" style="inset:0;background:linear-gradient(180deg,rgba(8,14,28,0.55) 0%,rgba(8,14,28,0.1) 45%,rgba(8,14,28,0.5) 100%)"></div>
