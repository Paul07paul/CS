<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "DM Serif Display"; font-style: normal; font-weight: 400; src: url("assets/fonts/dmserif.woff2") format("woff2"); }
        @font-face { font-family: "DM Serif Display"; font-style: italic; font-weight: 400; src: url("assets/fonts/dmserif-italic.woff2") format("woff2"); }
        @font-face { font-family: "Montserrat"; font-style: normal; font-weight: 100 900; src: url("assets/fonts/montserrat.woff2") format("woff2"); }
        #root { position: absolute; inset: 0; overflow: hidden; color: #F3EDE2; font-family: "Montserrat", sans-serif; }
        #s1-head { position: absolute; left: 60px; right: 60px; top: 190px; height: 300px; }
        #s1-scrim { position: absolute; left: 0; top: 0; width: 1080px; height: 680px; background: linear-gradient(180deg, #0E1624 0%, #0E1624 68%, rgba(14,22,36,0) 100%); }
        .s1-line { position: absolute; left: 0; right: 0; text-align: center; }
        #s1-h1 { top: 0; font-weight: 700; font-size: 64px; letter-spacing: -0.01em; }
        #s1-h2 { top: 86px; font-family: "DM Serif Display", serif; font-style: italic; font-size: 68px; white-space: nowrap; line-height: 1.05; color: #D6A55A; }
        #s1-h3 { top: 0; font-weight: 600; font-size: 52px; }
        #s1-h4 { top: 72px; font-family: "DM Serif Display", serif; font-size: 124px; line-height: 1; color: #D6A55A; }
        #s1-feedwrap { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
        #s1-feed { position: absolute; left: 110px; top: 0; width: 860px; }
        .s1-card { position: absolute; left: 0; width: 860px; height: 620px; }
        .s1-paper { position: absolute; inset: 0; background: #E9E6E1; border-radius: 22px; box-shadow: 0 30px 60px rgba(0,0,0,0.35); }
        .s1-photos { position: absolute; left: 0; top: 0; width: 860px; height: 360px; border-radius: 22px 22px 0 0; overflow: hidden; filter: grayscale(1) contrast(0.85) brightness(1.05); }
        .s1-p1 { position: absolute; left: 0; top: 0; width: 566px; height: 360px; }
        .s1-p2 { position: absolute; left: 574px; top: 0; width: 286px; height: 176px; }
        .s1-p3 { position: absolute; left: 574px; top: 184px; width: 286px; height: 176px; }
        .s1-body { position: absolute; left: 36px; right: 36px; top: 384px; height: 220px; }
        .s1-t { position: absolute; left: 0; top: 0; font-weight: 700; font-size: 36px; color: #3A4048; }
        .s1-loc { position: absolute; left: 0; top: 50px; font-weight: 500; font-size: 26px; color: #565C64; }
        .s1-price { position: absolute; right: 0; top: 0; font-weight: 800; font-size: 40px; color: #2F343A; }
        .s1-bar { position: absolute; left: 0; height: 16px; border-radius: 8px; background: #CFCBC4; }
        .s1-chip { position: absolute; top: 96px; height: 40px; padding: 0 18px; border-radius: 20px; background: #DAD6CF; color: #474D55; font-weight: 600; font-size: 22px; line-height: 40px; }
        #s1-target { perspective: 1800px; }
        #s1-card3d { position: absolute; inset: 0; transform-style: preserve-3d; }
        #s1-vid { position: absolute; left: 110px; top: 600px; width: 860px; height: 920px; border-radius: 30px; overflow: hidden; background: #0E1624; box-shadow: 0 40px 90px rgba(0,0,0,0.5), 0 0 0 3px rgba(214,165,90,0.9); }
        #s1-vimg { position: absolute; left: -40px; top: -40px; width: 940px; height: 1040px; }
        #s1-vshade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(14,22,36,0) 45%, rgba(14,22,36,0.88) 100%); }
        #s1-vtag { position: absolute; left: 36px; top: 36px; height: 52px; padding: 0 22px; border-radius: 26px; background: rgba(14,22,36,0.72); color: #F3EDE2; font-weight: 700; font-size: 24px; line-height: 52px; letter-spacing: 0.08em; }
        #s1-vtag b { color: #D6A55A; }
        #s1-vt1 { position: absolute; left: 44px; bottom: 170px; font-family: "DM Serif Display", serif; font-size: 76px; line-height: 1; color: #F3EDE2; }
        #s1-vt2 { position: absolute; left: 46px; bottom: 116px; font-weight: 600; font-size: 30px; color: #E8D3AE; letter-spacing: 0.02em; }
        #s1-vprog { position: absolute; left: 46px; right: 46px; bottom: 64px; height: 8px; border-radius: 4px; background: rgba(243,237,226,0.25); }
        #s1-vfill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 4px; background: #D6A55A; transform-origin: left center; }
        #s1-vplay { position: absolute; right: 44px; bottom: 150px; width: 112px; height: 112px; border-radius: 56px; background: #D6A55A; }
        #s1-vplay svg { position: absolute; left: 38px; top: 32px; }
        .s1-badge { position: absolute; height: 56px; padding: 0 24px; border-radius: 28px; background: #F3EDE2; color: #0E1624; font-weight: 800; font-size: 24px; line-height: 56px; letter-spacing: 0.04em; box-shadow: 0 14px 30px rgba(0,0,0,0.35); }
      </style>

      <div id="root" data-composition-id="s1-annonce" data-start="0" data-duration="5.5" data-width="1080" data-height="1920">
        <div id="s1-feedwrap"><div id="s1-feed"></div></div>
        <div id="s1-scrim"></div>
        <div id="s1-vid">
          <div id="s1-vimg"></div>
          <div id="s1-vshade"></div>
          <div id="s1-vtag">● <b>VIDÉO</b> · 9:16</div>
          <div id="s1-vt1">Villa d'architecte</div>
          <div id="s1-vt2">Vue mer · 5 pièces · 140 m² · Piscine</div>
          <div id="s1-vplay"><svg width="44" height="48" viewBox="0 0 44 48"><polygon points="0,0 44,24 0,48" fill="#0E1624" /></svg></div>
          <div id="s1-vprog"><div id="s1-vfill"></div></div>
        </div>
        <div id="s1-b1" class="s1-badge" style="left: 64px; top: 1470px">Reels · TikTok</div>
        <div id="s1-b2" class="s1-badge" style="left: 650px; top: 1470px">Motion design</div>
        <div id="s1-head">
          <div id="s1-h1" class="s1-line">Votre annonce</div>
          <div id="s1-h2" class="s1-line">ressemble à toutes les autres ?</div>
          <div id="s1-h3" class="s1-line">Paul Digital la transforme en</div>
          <div id="s1-h4" class="s1-line">vidéo premium.</div>
        </div>
      </div>

      <script>
        (function () {
          const feed = document.getElementById("s1-feed");
          const STEP = 660, TARGET = 3, N = 6;
          const titles = ["Appartement T3 · 68 m²", "Maison 4 pièces · 110 m²", "Studio · 28 m²", "Maison 5 pièces · 140 m²", "Appartement T2 · 45 m²", "Maison 6 pièces · 180 m²"];
          const prices = ["265 000 €", "349 000 €", "119 000 €", "485 000 €", "189 000 €", "590 000 €"];
          function cardHTML(i, inner3d) {
            const L = (cls, z, html) => `<div class="${cls} s1-layer" data-z="${z}">${html}</div>`;
            const body =
              L("s1-paper", 0, "") +
              L("s1-photos", 70, `<div class="s1-p1">${PDIso.photo("main")}</div><div class="s1-p2">${PDIso.photo("salon")}</div><div class="s1-p3">${PDIso.photo("pool")}</div>`) +
              L("s1-body", 40,
                `<div class="s1-t" data-layout-allow-overlap>${titles[i]}</div><div class="s1-price" data-layout-allow-overlap>${prices[i]}</div><div class="s1-loc">Secteur résidentiel calme</div>` +
                `<div class="s1-chip" style="left:0">5 pièces</div><div class="s1-chip" style="left:150px">3 chambres</div><div class="s1-chip" style="left:322px">Piscine</div>` +
                `<div class="s1-bar" style="top:160px;width:760px"></div><div class="s1-bar" style="top:190px;width:520px"></div>`);
            return inner3d ? `<div id="s1-card3d" data-layout-allow-overlap>${body}</div>` : body;
          }
          for (let i = 0; i < N; i++) {
            const c = document.createElement("div");
            c.className = "s1-card";
            if (i === TARGET) c.id = "s1-target";
            c.style.top = i * STEP + "px";
            c.innerHTML = cardHTML(i, i === TARGET);
            feed.appendChild(c);
          }
          document.getElementById("s1-vimg").innerHTML = PDIso.photo("vid");

          const tl = gsap.timeline({ paused: true });
          const FEED_END = 700 - TARGET * STEP; // target card lands at y=700

          // ---- Frame 1: the flat listing (0 – 2.5s)
          tl.fromTo(feed, { y: FEED_END + 2600 }, { y: FEED_END, duration: 1.5, ease: "power3.out" }, 0);
          tl.fromTo("#s1-feedwrap", { filter: "blur(10px)" }, { filter: "blur(0px)", duration: 1.1, ease: "power2.out" }, 0.2);
          const others = Array.from(feed.children).filter((c) => c.id !== "s1-target");
          tl.fromTo(others, { opacity: 1 }, { opacity: 0.28, duration: 0.5, ease: "power1.out" }, 1.3);
          tl.fromTo("#s1-h1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.15);
          tl.fromTo("#s1-h2", { opacity: 0, y: 50, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.6, ease: "back.out(1.6)" }, 0.45);

          // ---- Frame 2: the transformation (2.5 – 5.5s)
          tl.to(["#s1-h1", "#s1-h2"], { opacity: 0, y: -50, duration: 0.35, ease: "power2.in", stagger: 0.06 }, 2.45);
          tl.to(others, { opacity: 0, y: (i) => (i < TARGET ? -220 : 260), duration: 0.5, ease: "power2.in" }, 2.5);
          tl.fromTo("#s1-card3d", { rotationX: 0, rotationY: 0, rotationZ: 0, scale: 1 }, { rotationX: 32, rotationY: -22, rotationZ: 6, scale: 0.92, duration: 0.8, ease: "power3.inOut" }, 2.55);
          document.querySelectorAll("#s1-card3d .s1-layer").forEach((el) => {
            const z = +el.dataset.z;
            tl.fromTo(el, { z: 0 }, { z: z * 2.2, duration: 0.8, ease: "power3.out" }, 2.7);
          });
          tl.fromTo("#s1-target .s1-photos", { filter: "grayscale(1) contrast(0.85) brightness(1.05)" }, { filter: "grayscale(0) contrast(1.05) brightness(1.05)", duration: 0.5, ease: "power1.inOut" }, 3.0);
          // card → premium video frame
          tl.fromTo("#s1-vid", { clipPath: "inset(140px 0px 520px 0px round 30px)", opacity: 0 }, { clipPath: "inset(0px 0px 0px 0px round 30px)", opacity: 1, duration: 0.6, ease: "expo.out" }, 3.45);
          tl.to("#s1-target", { opacity: 0, duration: 0.25, ease: "power1.in" }, 3.45);
          tl.fromTo("#s1-vimg", { scale: 1.18, x: 30 }, { scale: 1.0, x: -20, duration: 2.0, ease: "none" }, 3.45);
          tl.fromTo("#s1-vtag", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 3.75);
          tl.fromTo("#s1-vt1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.8);
          tl.fromTo("#s1-vt2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 3.95);
          tl.fromTo("#s1-vplay", { scale: 0 }, { scale: 1, duration: 0.5, ease: "back.out(2.2)" }, 3.9);
          tl.fromTo("#s1-vfill", { scaleX: 0 }, { scaleX: 1, duration: 1.5, ease: "none" }, 3.7);
          tl.fromTo("#s1-b1", { opacity: 0, scale: 0.6, rotation: -8 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.45, ease: "back.out(2)" }, 4.15);
          tl.fromTo("#s1-b2", { opacity: 0, scale: 0.6, rotation: 8 }, { opacity: 1, scale: 1, rotation: 4, duration: 0.45, ease: "back.out(2)" }, 4.3);
          tl.fromTo("#s1-h3", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 3.2);
          tl.fromTo("#s1-h4", { opacity: 0, scale: 0.7, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.6, ease: "back.out(1.8)" }, 3.45);
          // zoom-through exit into the 3D villa
          tl.to(["#s1-vid", "#s1-b1", "#s1-b2"], { scale: 2.6, opacity: 0, filter: "blur(14px)", duration: 0.5, ease: "power3.in" }, 5.0);
          tl.to(["#s1-h3", "#s1-h4"], { y: -80, opacity: 0, duration: 0.4, ease: "power2.in" }, 5.05);

          window.__timelines["s1-annonce"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
