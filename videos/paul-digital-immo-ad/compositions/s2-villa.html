<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Montserrat"; font-style: normal; font-weight: 100 900; src: url("assets/fonts/montserrat.woff2") format("woff2"); }
        #root { position: absolute; inset: 0; overflow: hidden; color: #0C1929; font-family: "Montserrat", sans-serif; }
        #s2-stage { position: absolute; inset: 0; }
        #s2-halo { position: absolute; left: 90px; top: 600px; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(26,105,250,0.22) 0%, rgba(26,105,250,0.08) 45%, rgba(26,105,250,0) 70%); }
        .iso-face { backface-visibility: visible; }
        .glass .iso-face { border: 1px solid rgba(255,255,255,0.55); }
        .caustics { position: absolute; inset: 0; background: repeating-linear-gradient(115deg, rgba(255,255,255,0) 0px, rgba(255,255,255,0) 26px, rgba(220,255,250,0.45) 30px, rgba(255,255,255,0) 36px); background-size: 200px 200px; }
        .s2-shadow { position: absolute; background: rgba(12,25,41,0.22); filter: blur(10px); border-radius: 8px; }
        .bb-pop { position: absolute; left: 0; bottom: 0; transform-origin: 50% 100%; display: flex; flex-direction: column; align-items: center; }
        .bb-pill { white-space: nowrap; height: 76px; padding: 0 30px 0 24px; border-radius: 38px; background: #FFFFFF; color: #0C1929; font-weight: 700; font-size: 38px; line-height: 76px; box-shadow: 0 16px 36px rgba(12,25,41,0.22); }
        .bb-pill i { display: inline-block; width: 14px; height: 14px; border-radius: 7px; background: #1A69FA; margin-right: 14px; vertical-align: 4px; }
        .bb-pill b { color: #1A69FA; font-weight: 800; }
        .bb-stem { width: 3px; height: 70px; background: #1A69FA; }
        .bb-dot { width: 22px; height: 22px; border-radius: 11px; background: #1A69FA; box-shadow: 0 0 0 7px rgba(26,105,250,0.28); margin-bottom: -11px; }
        .bb-pin { width: 70px; height: 92px; margin-bottom: -6px; }
        #s2-head { position: absolute; left: 70px; right: 70px; top: 200px; height: 330px; }
        .s2-kick { position: absolute; left: 0; right: 0; top: 0; text-align: center; font-weight: 700; font-size: 28px; letter-spacing: 0.32em; color: #1A69FA; }
        .s2-title { position: absolute; left: 0; right: 0; top: 50px; text-align: center; font-weight: 800; font-size: 78px; line-height: 1.06; letter-spacing: -0.015em; color: #0C1929; white-space: nowrap; }
        .s2-title em { font-style: normal; font-weight: 500; color: #1A69FA; }
        #s2-t1a { top: 30px; }
        #s2-t1b { top: 122px; font-weight: 500; font-size: 66px; color: #1A69FA; }
        /* property sheet */
        #s2-card { position: absolute; left: 60px; width: 960px; top: 1330px; height: 236px; border-radius: 32px; background: #FFFFFF; box-shadow: 0 30px 70px rgba(12,25,41,0.18); overflow: hidden; }
        #s2-card .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: #1A69FA; }
        #s2-ct { position: absolute; left: 48px; top: 30px; font-weight: 800; font-size: 38px; color: #0C1929; white-space: nowrap; }
        #s2-cl { position: absolute; left: 48px; top: 80px; font-weight: 600; font-size: 26px; color: #4A5A72; white-space: nowrap; }
        #s2-cl svg { vertical-align: -4px; margin-right: 8px; }
        .s2-cell { position: absolute; top: 136px; height: 76px; }
        .s2-cell .v { font-weight: 800; font-size: 40px; color: #1A69FA; line-height: 44px; white-space: nowrap; }
        .s2-cell .k { font-weight: 600; font-size: 20px; letter-spacing: 0.14em; color: #55657D; line-height: 28px; }
        .s2-sep { position: absolute; top: 140px; width: 2px; height: 66px; background: #E1E8F3; }
      </style>

      <div id="root" data-composition-id="s2-villa" data-start="0" data-duration="12.5" data-width="1080" data-height="1920">
        <div id="s2-halo"></div>
        <div id="s2-stage"></div>
        <div id="s2-head">
          <div id="s2-t1a" class="s2-title">Chaque bien</div>
          <div id="s2-t1b" class="s2-title">mérite sa mise en scène.</div>
          <div id="s2-k2" class="s2-kick">EXTÉRIEUR · TERRASSE · PISCINE</div>
          <div id="s2-t2" class="s2-title">Chaque détail <em>compte.</em></div>
          <div id="s2-k3" class="s2-kick">INTÉRIEUR</div>
          <div id="s2-t3" class="s2-title">Pièce par <em>pièce.</em></div>
          <div id="s2-k4" class="s2-kick">VUE · EMPLACEMENT</div>
          <div id="s2-t4" class="s2-title">Et tout <em>autour.</em></div>
        </div>
        <div id="s2-card">
          <div class="bar"></div>
          <div id="s2-ct">Villa d'architecte · Vue mer</div>
          <div id="s2-cl"><svg width="20" height="26" viewBox="0 0 20 26"><path d="M10 25 C10 25 1 15 1 9 A9 9 0 0 1 19 9 C19 15 10 25 10 25 Z" fill="#1A69FA"/><circle cx="10" cy="9" r="3.5" fill="#FFFFFF"/></svg>Quartier résidentiel · Plage à 5 min</div>
          <div class="s2-cell" style="left: 48px"><div class="v"><span id="s2-price">0</span> €</div><div class="k">PRIX</div></div>
          <div class="s2-sep" style="left: 344px"></div>
          <div class="s2-cell" style="left: 376px"><div class="v"><span id="s2-surf">0</span> m²</div><div class="k">SURFACE</div></div>
          <div class="s2-sep" style="left: 586px"></div>
          <div class="s2-cell" style="left: 618px"><div class="v"><span id="s2-ch">0</span> ch.</div><div class="k">CHAMBRES</div></div>
          <div class="s2-sep" style="left: 780px"></div>
          <div class="s2-cell" style="left: 812px"><div class="v">1</div><div class="k">PISCINE</div></div>
        </div>
      </div>

      <script>
        (function () {
          const B = PDIso.box;
          const r = PDIso.rig(document.getElementById("s2-stage"), 800, [540, 1080]);
          const plane = r.plane;

          // ---------- City map (behind / around the plinth) ----------
          const map = document.createElement("div");
          map.className = "iso-face";
          map.style.cssText = "position:absolute;left:-1500px;top:-1500px;width:3800px;height:3800px;transform:translateZ(-70px);";
          const off = 1500;
          const streets = [-120, 920, 1720, -920];
          let svg = `<svg width="3800" height="3800" viewBox="0 0 3800 3800"><rect width="3800" height="3800" fill="#E4EBF5"/>`;
          svg += `<rect x="${1820 + off}" y="0" width="${3800 - 1820 - off}" height="3800" fill="#A9CBF7"/>`;
          svg += `<rect x="${1700 + off}" y="0" width="120" height="3800" fill="#F1E3C6"/>`;
          streets.forEach((s) => {
            svg += `<rect x="${s - 30 + off}" y="0" width="60" height="3800" fill="#FFFFFF"/>`;
            svg += `<rect x="0" y="${s - 30 + off}" width="${1700 + off}" height="60" fill="#FFFFFF"/>`;
          });
          svg += `<circle id="s2-radius" cx="${400 + off}" cy="${400 + off}" r="760" fill="rgba(26,105,250,0.07)" stroke="#1A69FA" stroke-width="10" stroke-dasharray="30 22"/>`;
          const routes = [
            `M ${400 + off} ${920 + off} L ${1720 + off} ${920 + off} L ${1720 + off} ${1000 + off}`,
            `M ${400 + off} ${920 + off} L ${300 + off} ${920 + off} L ${300 + off} ${1300 + off}`,
            `M ${400 + off} ${-120 + off} L ${-920 + off} ${-120 + off} L ${-920 + off} ${-700 + off}`,
          ];
          routes.forEach((d, i) => (svg += `<path class="s2-route" id="s2-route${i}" d="${d}" fill="none" stroke="#1A69FA" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>`));
          svg += `</svg>`;
          map.innerHTML = svg;
          plane.appendChild(map);

          const city = [];
          const blockOrigins = [];
          const cells = [-880, -80, 960];
          cells.forEach((bx) => cells.forEach((by) => { if (!(bx === -80 && by === -80)) blockOrigins.push([bx, by]); }));
          blockOrigins.forEach(([bx, by], bi) => {
            for (let k = 0; k < 4; k++) {
              const x = bx + 40 + (k % 2) * 340, y = by + 40 + Math.floor(k / 2) * 340;
              if (x > 1620) continue;
              const h = 40 + ((bi * 7 + k * 13) % 5) * 34;
              const col = (bi + k) % 3 === 0 ? "#C9D6EA" : (bi + k) % 3 === 1 ? "#B4C6E2" : "#DCE5F2";
              city.push(B(plane, x, y, -70, 260, 260, h, { color: col, cls: "city" }));
            }
          });

          // ---------- The villa ----------
          const shadow = document.createElement("div");
          shadow.className = "s2-shadow";
          shadow.style.cssText += "left:150px;top:130px;width:420px;height:500px;";
          plane.appendChild(shadow);
          gsap.set(shadow, { z: 4.5 });
          shadow._z = 4.5;
          const g = PDIso.villa(plane);

          // ---------- Billboards ----------
          function label(x, y, z, html, pin) {
            const inner = pin
              ? `<div class="bb-pop"><svg class="bb-pin" viewBox="0 0 70 92"><path d="M35 90 C35 90 4 54 4 34 A31 31 0 0 1 66 34 C66 54 35 90 35 90 Z" fill="#1A69FA"/><circle cx="35" cy="34" r="13" fill="#FFFFFF"/></svg></div>`
              : `<div class="bb-pop"><div class="bb-pill"><i></i>${html}</div><div class="bb-stem"></div><div class="bb-dot"></div></div>`;
            const b = PDIso.billboard(plane, x, y, z, inner);
            r.api.addBillboard(b);
            const pop = b.querySelector(".bb-pop");
            gsap.set(pop, { xPercent: -50 });
            return pop;
          }
          const L = {
            pool: label(590, 515, 18, "Piscine <b>10 × 4 m</b>"),
            deck: label(748, 700, 14, "Terrasse <b>45 m²</b>"),
            garden: label(720, 290, 110, "Jardin paysager"),
            salon: label(440, 240, 40, "Salon lumineux <b>42 m²</b>"),
            kitchen: label(240, 230, 56, "Cuisine équipée"),
            bedroom: label(250, 450, 42, "Suite <b>parentale</b>"),
            bathroom: label(230, 565, 40, "Salle de bain <b>& douche</b>"),
            pin: label(400, 400, 160, "", true),
            beach: label(1760, 1000, -70, "Plage · <b>5 min</b>"),
            school: label(300, 1300, -70, "Écoles · <b>8 min</b>"),
            center: label(-920, -700, -70, "Centre-ville · <b>10 min</b>"),
          };

          const tl = gsap.timeline({ paused: true });
          const api = r.api;
          gsap.set(api, { rx: 60, rz: 15, zoom: 1.7, tx: 0, ty: 0, tz: 0, ox: 0, oy: 40 });

          // ================= Frame 3 — assembly (0 – 2.5s)
          tl.fromTo(api, { zoom: 1.7, rz: 15 }, { zoom: 0.86, rz: 40, duration: 1.3, ease: "expo.out" }, 0);
          tl.fromTo(api, { rz: 40 }, { rz: 47, zoom: 0.9, duration: 1.2, ease: "none", immediateRender: false }, 1.3);
          tl.fromTo("#s2-halo", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 0.2);
          const drop = (els, at, stagger, from, ease) =>
            els.forEach((el, i) => tl.fromTo(el, { z: el._z + from }, { z: el._z, duration: 0.7, ease: ease || "power3.out" }, at + i * stagger));
          drop(g.plinth, 0.0, 0, -1800, "expo.out");
          map.style.opacity = "0";
          drop(g.ground, 0.12, 0.03, 1600);
          drop(g.floor, 0.25, 0.03, 1600);
          drop(g.deck.concat(g.pool), 0.32, 0.05, 1600);
          drop([shadow], 0.35, 0, 1600);
          drop([].concat(...Object.values(g.furniture)), 0.4, 0.008, 1600);
          drop(g.walls.concat(g.glass), 0.55, 0.015, 1700, "back.out(1.1)");
          drop(g.roof, 0.95, 0.08, 1500, "back.out(1.2)");
          drop([].concat(...g.trees), 0.8, 0.025, 1500, "back.out(1.4)");
          tl.fromTo(".caustics", { backgroundPosition: "0px 0px" }, { backgroundPosition: "500px 250px", duration: 12.5, ease: "none" }, 0);
          tl.fromTo("#s2-t1a", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.0);
          tl.fromTo("#s2-t1b", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 1.15);
          tl.to(["#s2-t1a", "#s2-t1b"], { opacity: 0, y: -40, duration: 0.35, ease: "power2.in", stagger: 0.05 }, 2.3);

          const kickIn = (k, t, at) => {
            tl.fromTo(k, { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at);
            tl.fromTo(t, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, at + 0.1);
          };
          const pop = (el, at, out) => {
            tl.fromTo(el, { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2)" }, at);
            if (out) tl.to(el, { scale: 0.6, opacity: 0, duration: 0.25, ease: "power2.in" }, out);
          };

          // ================= Frame 4 — exterior + property sheet (2.5 – 5.5s)
          tl.to(api, { tx: 200, ty: 50, zoom: 1.5, rz: 40, oy: 10, duration: 0.85, ease: "power3.inOut" }, 2.45);
          tl.to(api, { rz: 33, zoom: 1.64, duration: 2.2, ease: "none" }, 3.3);
          kickIn("#s2-k2", "#s2-t2", 2.6);
          pop(L.pool, 3.15, 5.3);
          pop(L.deck, 3.45, 5.3);
          pop(L.garden, 3.75, 5.3);
          tl.fromTo("#s2-card", { y: 320, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power4.out" }, 3.0);
          tl.fromTo("#s2-card .bar", { scaleY: 0, transformOrigin: "50% 0%" }, { scaleY: 1, duration: 0.5, ease: "power3.out" }, 3.2);
          tl.fromTo(["#s2-ct", "#s2-cl"], { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out", stagger: 0.08 }, 3.25);
          tl.fromTo("#s2-card .s2-cell", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(1.8)", stagger: 0.09 }, 3.45);
          const fmt = (v) => String(Math.round(v)).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
          const counter = (id, to, at, dur, step) => {
            const el = document.getElementById(id);
            let cur = 0;
            const o = { v(x) { if (x === undefined) return cur; cur = x; el.textContent = fmt(Math.round(x / step) * step); } };
            tl.fromTo(o, { v: 0 }, { v: to, duration: dur, ease: "power3.out" }, at);
          };
          counter("s2-price", 485000, 3.5, 1.2, 1000);
          counter("s2-surf", 140, 3.6, 1.0, 1);
          counter("s2-ch", 3, 3.7, 0.7, 1);
          tl.to("#s2-card", { y: 320, opacity: 0, duration: 0.4, ease: "power3.in" }, 5.2);
          tl.to(["#s2-k2", "#s2-t2"], { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, 5.25);

          // ================= Frame 5 — rooms (5.5 – 10s)
          g.roof.forEach((el, i) => tl.to(el, { z: el._z + 1400, duration: 0.6, ease: "power2.in" }, 5.45 + i * 0.06));
          const cut = PDIso.heightScaler(g.walls.concat(g.glass));
          tl.fromTo(cut, { h: 1 }, { h: 0.3, duration: 0.55, ease: "power3.inOut" }, 5.6);
          tl.to(api, { tx: 40, ty: -150, zoom: 2.2, rz: 38, rx: 52, oy: 140, duration: 0.8, ease: "power3.inOut" }, 5.5);
          tl.to(api, { tx: -160, ty: -150, rz: 32, duration: 0.6, ease: "power3.inOut" }, 7.05);
          tl.to(api, { tx: -150, ty: 60, rz: 40, duration: 0.6, ease: "power3.inOut" }, 8.05);
          tl.to(api, { tx: -170, ty: 165, zoom: 2.5, rz: 46, duration: 0.6, ease: "power3.inOut" }, 9.05);
          const rooms = [["salon", 6.2], ["kitchen", 7.2], ["bedroom", 8.2], ["bathroom", 9.2]];
          rooms.forEach(([name, on], i) => {
            tl.fromTo(g.glows[name], { opacity: 0 }, { opacity: 1, duration: 0.35, ease: "power2.out" }, on);
            tl.to(g.glows[name], { opacity: i < 3 ? 0.35 : 0, duration: 0.35, ease: "power1.inOut" }, i < 3 ? on + 1.0 : 9.95);
            pop(L[name], on + 0.1, i < 3 ? on + 0.9 : 9.9);
          });
          ["salon", "kitchen", "bedroom"].forEach((n) => tl.to(g.glows[n], { opacity: 0, duration: 0.3 }, 9.95));
          kickIn("#s2-k3", "#s2-t3", 5.6);
          tl.to(["#s2-k3", "#s2-t3"], { opacity: 0, y: -30, duration: 0.3, ease: "power2.in" }, 9.85);

          // ================= Frame 6 — location (10 – 12.5s)
          g.roof.forEach((el, i) => tl.to(el, { z: el._z, duration: 0.45, ease: "power3.out" }, 10.0 + i * 0.05));
          tl.fromTo(cut, { h: 0.3 }, { h: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, 10.0);
          tl.to(api, { tx: 0, ty: 0, zoom: 0.4, rx: 58, rz: 45, oy: 60, duration: 1.3, ease: "expo.inOut" }, 10.05);
          tl.to("#s2-halo", { opacity: 0, duration: 0.6 }, 10.1);
          tl.fromTo(map, { opacity: 0 }, { opacity: 1, duration: 0.6, ease: "power1.out" }, 10.4);
          city.forEach((el) => (el.style.display = "none"));
          tl.set(city, { display: "block" }, 10.85);
          city.forEach((el, i) => tl.fromTo(el, { z: el._z + 500 }, { z: el._z, duration: 0.5, ease: "power3.out" }, 10.85 + ((i * 7) % city.length) * 0.01));
          tl.fromTo("#s2-radius", { opacity: 0, scale: 0.4, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.6, ease: "back.out(1.4)" }, 11.05);
          document.querySelectorAll(".s2-route").forEach((p, i) => {
            tl.fromTo(p, { strokeDasharray: 4000, strokeDashoffset: 4000 }, { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 11.15 + i * 0.12);
          });
          tl.fromTo(L.pin, { y: -260, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "bounce.out" }, 10.85);
          pop(L.beach, 11.5);
          pop(L.school, 11.62);
          pop(L.center, 11.74);
          kickIn("#s2-k4", "#s2-t4", 10.5);
          // whip out to the left
          tl.to(["#s2-stage", "#s2-head", "#s2-halo"], { x: -1080, filter: "blur(16px)", duration: 0.3, ease: "power3.in" }, 12.2);

          window.__timelines["s2-villa"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
