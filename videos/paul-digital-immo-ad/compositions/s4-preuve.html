      <script>
        (function () {
          document.querySelector("#s4-d1 .img").innerHTML = PDIso.photo("fmt1");
          document.querySelector("#s4-d2 .img").innerHTML = PDIso.photo("salon");
          document.querySelector("#s4-d3 .img").innerHTML = PDIso.photo("pool");
          const bens = [
            "Des annonces <b>plus attractives</b>",
            "Vos biens <b>mieux mis en valeur</b>",
            "Un contenu <b>taillé pour les réseaux</b>",
            "<b>Plus d'impact</b> auprès des acheteurs",
            "Une image <b>pro et moderne</b>",
          ];
          const list = document.getElementById("s4-list");
          bens.forEach((t, i) => {
            const d = document.createElement("div");
            d.className = "s4-ben";
            d.style.top = i * 176 + "px";
            d.innerHTML = `<svg width="68" height="68" viewBox="0 0 68 68"><circle cx="34" cy="34" r="32" fill="#1A69FA"/><path class="s4-tick" d="M19 35 L30 46 L50 24" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="50" stroke-dashoffset="50"/></svg><span>${t}</span>`;
            list.appendChild(d);
          });

          const tl = gsap.timeline({ paused: true });
          // ---- Frame 8: commitments (0 – 2.5s)
          tl.fromTo("#s4-a", { scale: 0.75, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.45, ease: "power3.out" }, 0);
          tl.fromTo("#s4-kick", { opacity: 0, y: -18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
          ["#s4-r1", "#s4-r2", "#s4-r3"].forEach((id, i) => {
            const at = 0.2 + i * 0.3;
            tl.fromTo(id + " .s4-num", { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: 0.5, ease: "power4.out" }, at);
            tl.fromTo(id + " .s4-lab", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, at + 0.12);
            tl.fromTo(id + " .s4-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, at + 0.1);
          });
          const counter = (id, from, to, at, dur) => {
            const el = document.getElementById(id);
            el.textContent = String(from);
            let cur = from;
            const api = { val(v) { if (v === undefined) return cur; cur = v; el.textContent = String(Math.round(v)); } };
            tl.fromTo(api, { val: from }, { val: to, duration: dur, ease: "power2.out" }, at);
          };
          counter("s4-n1", 5, 0, 0.3, 0.9);
          counter("s4-n2", 0, 3, 0.55, 0.7);
          counter("s4-n3", 0, 100, 0.85, 1.0);
          tl.to("#s4-a", { y: -240, opacity: 0, duration: 0.4, ease: "power3.in" }, 2.2);

          // ---- Frame 9: benefits (2.5 – 5.5s)
          tl.fromTo("#s4-bt1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.5);
          tl.fromTo("#s4-bt2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 2.62);
          list.querySelectorAll(".s4-ben").forEach((b, i) => {
            const at = 2.75 + i * 0.3;
            tl.fromTo(b, { opacity: 0, x: i % 2 ? 160 : -160, rotation: i % 2 ? 2 : -2 }, { opacity: 1, x: 0, rotation: 0, duration: 0.55, ease: "power4.out" }, at);
            tl.fromTo(b.querySelector(".s4-tick"), { strokeDashoffset: 50 }, { strokeDashoffset: 0, duration: 0.3, ease: "power2.out" }, at + 0.2);
          });
          tl.to("#s4-b", { scale: 0.85, opacity: 0, duration: 0.35, ease: "power3.in" }, 5.2);

          // ---- Frame 9b: formats (5.5 – 9s)
          tl.fromTo("#s4-ct1", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 5.5);
          tl.fromTo("#s4-ct2", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 5.62);
          tl.fromTo("#s4-d1", { y: 1600, rotation: -6 }, { y: 0, rotation: 0, duration: 0.7, ease: "power4.out" }, 5.6);
          tl.fromTo("#s4-d2", { x: 700, rotation: 8 }, { x: 0, rotation: 0, duration: 0.65, ease: "power4.out" }, 5.8);
          tl.fromTo("#s4-d3", { x: 700, rotation: -8 }, { x: 0, rotation: 0, duration: 0.65, ease: "power4.out" }, 5.95);
          tl.fromTo(".s4-dev .img", { scale: 1.12 }, { scale: 1, duration: 3.4, ease: "none" }, 5.6);
          tl.fromTo(".s4-dev .fill", { scaleX: 0 }, { scaleX: 1, duration: 3.0, ease: "none" }, 5.9);
          tl.fromTo(".s4-dev .cap", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.12 }, 6.2);
          [["#s4-f1", "#s4-p1"], ["#s4-f2", "#s4-p2"], ["#s4-f3", "#s4-p3"]].forEach(([f, p], i) => {
            tl.fromTo(f, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 6.4 + i * 0.18);
            tl.fromTo(p, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2)" }, 6.45 + i * 0.18);
          });
          tl.to("#s4-c", { scale: 1.5, opacity: 0, filter: "blur(12px)", duration: 0.4, ease: "power3.in" }, 8.6);
          window.__timelines["s4-preuve"] = tl;
        })();
      </script>
