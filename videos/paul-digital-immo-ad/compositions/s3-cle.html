<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "DM Serif Display"; font-style: normal; font-weight: 400; src: url("assets/fonts/dmserif.woff2") format("woff2"); }
        @font-face { font-family: "DM Serif Display"; font-style: italic; font-weight: 400; src: url("assets/fonts/dmserif-italic.woff2") format("woff2"); }
        @font-face { font-family: "Montserrat"; font-style: normal; font-weight: 100 900; src: url("assets/fonts/montserrat.woff2") format("woff2"); }
        #root { position: absolute; inset: 0; overflow: hidden; color: #F3EDE2; font-family: "Montserrat", sans-serif; }
        #s3-all { position: absolute; inset: 0; }
        #s3-head { position: absolute; left: 80px; right: 80px; top: 200px; height: 300px; text-align: center; }
        #s3-h1 { position: absolute; left: 0; right: 0; top: 0; font-weight: 700; font-size: 46px; white-space: nowrap; }
        #s3-h2 { position: absolute; left: 0; right: 0; top: 70px; font-family: "DM Serif Display", serif; font-style: italic; font-size: 92px; white-space: nowrap; line-height: 1; color: #D6A55A; }
        #s3-line { position: absolute; left: 213px; top: 690px; width: 6px; height: 760px; background: rgba(214,165,90,0.22); border-radius: 3px; }
        #s3-linefill { position: absolute; left: 0; top: 0; width: 6px; height: 760px; background: #D6A55A; border-radius: 3px; transform-origin: 50% 0%; }
        .s3-step { position: absolute; left: 120px; width: 860px; height: 200px; }
        .s3-ico { position: absolute; left: 0; top: 0; width: 192px; height: 192px; border-radius: 96px; background: #16243A; box-shadow: 0 0 0 4px #D6A55A, 0 24px 50px rgba(0,0,0,0.4); }
        .s3-ico svg { position: absolute; left: 46px; top: 46px; }
        .s3-num { position: absolute; left: 236px; top: 26px; font-weight: 700; font-size: 26px; letter-spacing: 0.3em; color: #D6A55A; }
        .s3-lab { position: absolute; left: 236px; top: 66px; width: 640px; font-weight: 700; font-size: 46px; line-height: 1.12; color: #F3EDE2; }
        .s3-sub { position: absolute; left: 236px; top: 128px; font-weight: 500; font-size: 28px; color: #B9C2CF; }
        #s3-ring { position: absolute; left: 0; top: 0; width: 192px; height: 192px; }
        #s3-mini { position: absolute; left: 610px; top: 650px; width: 300px; height: 220px; border-radius: 14px; background: #E9E6E1; box-shadow: 0 20px 40px rgba(0,0,0,0.4); overflow: hidden; }
        #s3-mini .ph { position: absolute; left: 0; top: 0; width: 300px; height: 130px; filter: grayscale(1); }
        #s3-mini .b { position: absolute; left: 18px; height: 14px; border-radius: 7px; background: #C9C5BE; }
        #s3-check { position: absolute; left: 6px; top: 6px; }
        .s3-tok { position: absolute; top: 132px; height: 44px; padding: 0 18px; border-radius: 22px; border: 2px solid rgba(214,165,90,0.7); color: #E8D3AE; font-weight: 600; font-size: 22px; line-height: 40px; }
      </style>

      <div id="root" data-composition-id="s3-cle" data-start="0" data-duration="3.5" data-width="1080" data-height="1920">
        <div id="s3-all">
          <div id="s3-head">
            <div id="s3-h1">Vous nous envoyez votre annonce.</div>
            <div id="s3-h2">On s'occupe du reste.</div>
          </div>
          <div id="s3-line"><div id="s3-linefill"></div></div>

          <div class="s3-step" id="s3-st1" style="top: 640px">
            <div class="s3-ico"><svg width="100" height="100" viewBox="0 0 100 100"><path d="M8 48 L92 10 L70 90 L48 60 Z" fill="none" stroke="#F3EDE2" stroke-width="7" stroke-linejoin="round"/><path d="M48 60 L92 10" stroke="#D6A55A" stroke-width="7" stroke-linecap="round"/></svg></div>
            <div class="s3-num">ÉTAPE 1</div>
            <div class="s3-lab">Vous envoyez l'annonce</div>
            <div class="s3-sub">Photos + texte, c'est tout.</div>
          </div>
          <div class="s3-step" id="s3-st2" style="top: 960px">
            <div class="s3-ico">
              <svg id="s3-ring" viewBox="0 0 192 192"><circle cx="96" cy="96" r="84" fill="none" stroke="rgba(214,165,90,0.25)" stroke-width="10"/><circle id="s3-arc" cx="96" cy="96" r="84" fill="none" stroke="#D6A55A" stroke-width="10" stroke-linecap="round" stroke-dasharray="528" stroke-dashoffset="528" transform="rotate(-90 96 96)"/></svg>
              <svg width="100" height="100" viewBox="0 0 100 100"><rect x="8" y="22" width="84" height="56" rx="10" fill="none" stroke="#F3EDE2" stroke-width="7"/><polygon points="42,36 64,50 42,64" fill="#D6A55A"/></svg>
            </div>
            <div class="s3-num">ÉTAPE 2</div>
            <div class="s3-lab">Nous créons votre vidéo</div>
            <div class="s3-tok" id="s3-tk1" style="left: 236px">Montage</div>
            <div class="s3-tok" id="s3-tk2" style="left: 400px">Motion design</div>
            <div class="s3-tok" id="s3-tk3" style="left: 624px">Textes animés</div>
          </div>
          <div class="s3-step" id="s3-st3" style="top: 1280px">
            <div class="s3-ico"><svg width="100" height="100" viewBox="0 0 100 100"><rect x="26" y="4" width="48" height="92" rx="10" fill="none" stroke="#F3EDE2" stroke-width="7"/><path id="s3-tick" d="M36 52 L46 62 L66 40" fill="none" stroke="#D6A55A" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="50" stroke-dashoffset="50"/></svg></div>
            <div class="s3-num">ÉTAPE 3</div>
            <div class="s3-lab">Prête à publier</div>
            <div class="s3-sub">Instagram · TikTok · Facebook</div>
          </div>
          <div id="s3-mini"><div class="ph"></div><div class="b" style="top: 150px; width: 200px"></div><div class="b" style="top: 178px; width: 140px"></div></div>
        </div>
      </div>

      <script>
        (function () {
          document.querySelector("#s3-mini .ph").innerHTML = PDIso.photo("main");
          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#s3-all", { x: 1080 }, { x: 0, duration: 0.45, ease: "power3.out" }, 0);
          tl.fromTo("#s3-h1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.15);
          tl.fromTo("#s3-h2", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.8)" }, 0.3);
          ["#s3-st1", "#s3-st2", "#s3-st3"].forEach((id, i) => {
            const at = 0.45 + i * 0.75;
            tl.fromTo(id + " .s3-ico", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, at);
            tl.fromTo([id + " .s3-num", id + " .s3-lab", id + " .s3-sub"], { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out", stagger: 0.06 }, at + 0.08);
          });
          // step 1: the flat listing flies into the "send" icon
          tl.fromTo("#s3-mini", { opacity: 0, x: 0, y: 0, scale: 1, rotation: 0 }, { opacity: 1, duration: 0.2 }, 0.4);
          tl.to("#s3-mini", { x: -520, y: -10, scale: 0.2, rotation: -18, opacity: 0, duration: 0.55, ease: "power3.in" }, 0.75);
          tl.fromTo("#s3-linefill", { scaleY: 0 }, { scaleY: 1, duration: 1.7, ease: "power1.inOut" }, 0.6);
          // step 2: progress ring fills, tokens tick in
          tl.fromTo("#s3-arc", { strokeDashoffset: 528 }, { strokeDashoffset: 0, duration: 0.85, ease: "power2.inOut" }, 1.3);
          ["#s3-tk1", "#s3-tk2", "#s3-tk3"].forEach((t, i) =>
            tl.fromTo(t, { opacity: 0, y: 16, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2)" }, 1.45 + i * 0.18));
          // step 3: check
          tl.fromTo("#s3-tick", { strokeDashoffset: 50 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 2.25);
          tl.fromTo("#s3-st3 .s3-ico", { boxShadow: "0 0 0 4px #D6A55A, 0 24px 50px rgba(0,0,0,0.4)" }, { boxShadow: "0 0 0 14px rgba(214,165,90,0.35), 0 24px 50px rgba(0,0,0,0.4)", duration: 0.4, ease: "power2.out" }, 2.3);
          // zoom-through exit
          tl.to("#s3-all", { scale: 1.6, opacity: 0, filter: "blur(12px)", duration: 0.4, ease: "power3.in" }, 3.1);
          window.__timelines["s3-cle"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
