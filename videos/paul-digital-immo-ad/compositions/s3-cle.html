<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        @font-face { font-family: "Montserrat"; font-style: normal; font-weight: 100 900; src: url("assets/fonts/montserrat.woff2") format("woff2"); }
        #root { position: absolute; inset: 0; overflow: hidden; color: #0C1929; font-family: "Montserrat", sans-serif; }
        #s3-all { position: absolute; inset: 0; }
        #s3-head { position: absolute; left: 60px; right: 60px; top: 200px; height: 220px; text-align: center; }
        .s3-h { position: absolute; left: 0; right: 0; white-space: nowrap; }
        #s3-h1 { top: 0; font-weight: 800; font-size: 54px; letter-spacing: -0.01em; }
        #s3-h2 { top: 70px; font-weight: 800; font-size: 54px; letter-spacing: -0.01em; }
        #s3-h2 em { font-style: normal; font-weight: 500; color: #1A69FA; }
        #s3-line { position: absolute; left: 213px; top: 560px; width: 6px; height: 560px; background: rgba(26,105,250,0.18); border-radius: 3px; }
        #s3-linefill { position: absolute; left: 0; top: 0; width: 6px; height: 560px; background: #1A69FA; border-radius: 3px; transform-origin: 50% 0%; }
        .s3-step { position: absolute; left: 120px; width: 880px; height: 200px; }
        .s3-ico { position: absolute; left: 0; top: 0; width: 192px; height: 192px; border-radius: 96px; background: #FFFFFF; box-shadow: 0 0 0 5px #1A69FA, 0 24px 50px rgba(12,25,41,0.16); }
        .s3-ico svg { position: absolute; left: 46px; top: 46px; }
        .s3-num { position: absolute; left: 236px; top: 26px; font-weight: 700; font-size: 26px; letter-spacing: 0.3em; color: #1A69FA; }
        .s3-lab { position: absolute; left: 236px; top: 66px; width: 640px; font-weight: 800; font-size: 46px; line-height: 1.12; color: #0C1929; white-space: nowrap; }
        .s3-sub { position: absolute; left: 236px; top: 128px; font-weight: 500; font-size: 28px; color: #4A5A72; white-space: nowrap; }
        #s3-ring { position: absolute; left: 0; top: 0; width: 192px; height: 192px; }
        #s3-mini { position: absolute; left: 640px; top: 480px; width: 300px; height: 220px; border-radius: 14px; background: #ECEDEF; border: 2px solid #D3D8E0; box-shadow: 0 20px 40px rgba(12,25,41,0.18); overflow: hidden; }
        #s3-mini .ph { position: absolute; left: 0; top: 0; width: 300px; height: 130px; filter: grayscale(1); }
        #s3-mini .b { position: absolute; left: 18px; height: 14px; border-radius: 7px; background: #C9CDD4; }
        .s3-tok { position: absolute; top: 132px; height: 44px; padding: 0 18px; border-radius: 22px; background: #E8F0FE; color: #1A69FA; font-weight: 700; font-size: 22px; line-height: 44px; }
        #s3-promise { position: absolute; left: 70px; right: 70px; top: 1250px; height: 220px; border-radius: 36px; background: #0C1929; box-shadow: 0 30px 70px rgba(12,25,41,0.25); text-align: center; }
        #s3-p1 { position: absolute; left: 0; right: 0; top: 46px; font-weight: 800; font-size: 46px; color: #FFFFFF; white-space: nowrap; }
        #s3-p2 { position: absolute; left: 0; right: 0; top: 114px; font-weight: 500; font-size: 46px; color: #6FA3FF; white-space: nowrap; }
      </style>

      <div id="root" data-composition-id="s3-cle" data-start="0" data-duration="7.5" data-width="1080" data-height="1920">
        <div id="s3-all">
          <div id="s3-head">
            <div id="s3-h1" class="s3-h">Vous nous envoyez vos photos</div>
            <div id="s3-h2" class="s3-h"><em>et les informations du bien.</em></div>
          </div>
          <div id="s3-line"><div id="s3-linefill"></div></div>

          <div class="s3-step" id="s3-st1" style="top: 500px">
            <div class="s3-ico"><svg width="100" height="100" viewBox="0 0 100 100"><rect x="10" y="22" width="80" height="60" rx="10" fill="none" stroke="#0C1929" stroke-width="7"/><circle cx="34" cy="44" r="8" fill="#1A69FA"/><path d="M14 76 L40 54 L56 66 L70 52 L88 70" fill="none" stroke="#1A69FA" stroke-width="7" stroke-linejoin="round"/></svg></div>
            <div class="s3-num">ÉTAPE 1</div>
            <div class="s3-lab">Photos + infos du bien</div>
            <div class="s3-sub">Vous les transmettez, c'est tout.</div>
          </div>
          <div class="s3-step" id="s3-st2" style="top: 760px">
            <div class="s3-ico">
              <svg id="s3-ring" viewBox="0 0 192 192"><circle cx="96" cy="96" r="84" fill="none" stroke="rgba(26,105,250,0.18)" stroke-width="10"/><circle id="s3-arc" cx="96" cy="96" r="84" fill="none" stroke="#1A69FA" stroke-width="10" stroke-linecap="round" stroke-dasharray="528" stroke-dashoffset="528" transform="rotate(-90 96 96)"/></svg>
              <svg width="100" height="100" viewBox="0 0 100 100"><rect x="8" y="22" width="84" height="56" rx="10" fill="none" stroke="#0C1929" stroke-width="7"/><polygon points="42,36 64,50 42,64" fill="#1A69FA"/></svg>
            </div>
            <div class="s3-num">ÉTAPE 2</div>
            <div class="s3-lab">Nous créons la vidéo</div>
            <div class="s3-tok" id="s3-tk1" style="left: 236px">Montage</div>
            <div class="s3-tok" id="s3-tk2" style="left: 400px">Motion design</div>
            <div class="s3-tok" id="s3-tk3" style="left: 624px">Textes animés</div>
          </div>
          <div class="s3-step" id="s3-st3" style="top: 1020px">
            <div class="s3-ico"><svg width="100" height="100" viewBox="0 0 100 100"><rect x="26" y="4" width="48" height="92" rx="10" fill="none" stroke="#0C1929" stroke-width="7"/><path id="s3-tick" d="M36 52 L46 62 L66 40" fill="none" stroke="#1A69FA" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="50" stroke-dashoffset="50"/></svg></div>
            <div class="s3-num">ÉTAPE 3</div>
            <div class="s3-lab">Prête à être publiée</div>
            <div class="s3-sub">Instagram · TikTok · Facebook</div>
          </div>
          <div id="s3-promise">
            <div id="s3-p1">Nous créons votre vidéo immobilière</div>
            <div id="s3-p2">prête à être publiée.</div>
          </div>
          <div id="s3-mini"><div class="ph"></div><div class="b" style="top: 150px; width: 200px"></div><div class="b" style="top: 178px; width: 140px"></div></div>
        </div>
      </div>

      <script>
        (function () {
          document.querySelector("#s3-mini .ph").innerHTML = PDIso.photo("mini");
          const tl = PDIso.stretch(gsap.timeline({ paused: true }), PD_HOLDS.s3);
          tl.fromTo("#s3-all", { x: 1080 }, { x: 0, duration: 0.45, ease: "power3.out" }, 0);
          tl.fromTo("#s3-h1", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.12);
          tl.fromTo("#s3-h2", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.24);
          ["#s3-st1", "#s3-st2", "#s3-st3"].forEach((id, i) => {
            const at = 0.4 + i * 0.6;
            tl.fromTo(id + " .s3-ico", { scale: 0, rotation: -40 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2)" }, at);
            tl.fromTo([id + " .s3-num", id + " .s3-lab", id + " .s3-sub"], { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out", stagger: 0.06 }, at + 0.08);
          });
          // step 1: the flat listing flies into the photo icon
          tl.fromTo("#s3-mini", { opacity: 0, x: 0, y: 0, scale: 1, rotation: 0 }, { opacity: 1, duration: 0.2 }, 0.35);
          tl.to("#s3-mini", { x: -560, y: 60, scale: 0.2, rotation: -18, opacity: 0, duration: 0.5, ease: "power3.in" }, 0.65);
          tl.fromTo("#s3-linefill", { scaleY: 0 }, { scaleY: 1, duration: 1.3, ease: "power1.inOut" }, 0.55);
          tl.fromTo("#s3-arc", { strokeDashoffset: 528 }, { strokeDashoffset: 0, duration: 0.75, ease: "power2.inOut" }, 1.1);
          ["#s3-tk1", "#s3-tk2", "#s3-tk3"].forEach((t, i) =>
            tl.fromTo(t, { opacity: 0, y: 16, scale: 0.85 }, { opacity: 1, y: 0, scale: 1, duration: 0.3, ease: "back.out(2)" }, 1.2 + i * 0.15));
          tl.fromTo("#s3-tick", { strokeDashoffset: 50 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, 1.85);
          tl.fromTo("#s3-promise", { opacity: 0, y: 80, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.55, ease: "power4.out" }, 2.05);
          tl.fromTo(["#s3-p1", "#s3-p2"], { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out", stagger: 0.1 }, 2.2);
          tl.to("#s3-all", { scale: 1.5, opacity: 0, filter: "blur(12px)", duration: 0.35, ease: "power3.in" }, 3.15);
          window.__timelines["s3-cle"] = tl.raw;
        })();
      </script>
    </template>
  </body>
</html>
