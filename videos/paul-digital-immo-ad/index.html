<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/iso.js"></script>
    <style>
      @font-face { font-family: "DM Serif Display"; font-style: normal; font-weight: 400; src: url("assets/fonts/dmserif.woff2") format("woff2"); }
      @font-face { font-family: "DM Serif Display"; font-style: italic; font-weight: 400; src: url("assets/fonts/dmserif-italic.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-style: normal; font-weight: 100 900; src: url("assets/fonts/montserrat.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #0E1624; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; font-family: "Montserrat", sans-serif; }
      .scene { position: absolute; inset: 0; }

      /* ---------- persistent background ---------- */
      #bg { position: absolute; inset: 0; background: #0E1624; overflow: hidden; }
      #bg-grid { position: absolute; left: -540px; top: -540px; width: 2160px; height: 3000px; opacity: 0.14; }
      #bg-glow1 { position: absolute; left: 380px; top: -320px; width: 1100px; height: 1100px; border-radius: 50%; background: radial-gradient(circle, rgba(214,165,90,0.28) 0%, rgba(214,165,90,0) 65%); }
      #bg-glow2 { position: absolute; left: -760px; top: 1000px; width: 1400px; height: 1400px; border-radius: 50%; background: radial-gradient(circle, rgba(70,110,170,0.20) 0%, rgba(70,110,170,0) 65%); }
      #bg-vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(14,22,36,0) 55%, rgba(6,10,18,0.65) 100%); }

      /* ---------- viewfinder (the spine) ---------- */
      #vf { position: absolute; inset: 0; pointer-events: none; }
      .vf-c { position: absolute; width: 96px; height: 96px; }
      .vf-c::before, .vf-c::after { content: ""; position: absolute; background: #D6A55A; border-radius: 3px; }
      .vf-c::before { width: 96px; height: 7px; }
      .vf-c::after { width: 7px; height: 96px; }
      #vf-tl { left: 56px; top: 150px; }
      #vf-tr { left: 928px; top: 150px; }
      #vf-tr::before { right: 0; } #vf-tr::after { right: 0; }
      #vf-bl { left: 56px; top: 1524px; }
      #vf-bl::before { bottom: 0; } #vf-bl::after { bottom: 0; }
      #vf-br { left: 928px; top: 1524px; }
      #vf-br::before { right: 0; bottom: 0; } #vf-br::after { right: 0; bottom: 0; }
      #vf-rec { position: absolute; left: 80px; top: 84px; height: 40px; font-weight: 700; font-size: 26px; letter-spacing: 0.18em; color: #F3EDE2; line-height: 40px; }
      #vf-dot { display: inline-block; width: 18px; height: 18px; border-radius: 9px; background: #E5484D; margin-right: 12px; vertical-align: -1px; }
      #vf-brand { position: absolute; right: 80px; top: 84px; height: 40px; font-weight: 800; font-size: 24px; letter-spacing: 0.22em; color: #F3EDE2; line-height: 40px; }
      #vf-brand b { color: #D6A55A; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="32" data-width="1080" data-height="1920">
      <div id="bg" class="clip" data-start="0" data-duration="32" data-track-index="0">
        <svg id="bg-grid" viewBox="0 0 2160 3000" width="2160" height="3000">
          <defs>
            <pattern id="iso-grid" width="120" height="69.28" patternUnits="userSpaceOnUse">
              <path d="M0 0 L120 69.28 M120 0 L0 69.28" stroke="#8FA6C8" stroke-width="2" fill="none" />
            </pattern>
          </defs>
          <rect width="2160" height="3000" fill="url(#iso-grid)" />
        </svg>
        <div id="bg-glow1"></div>
        <div id="bg-vignette"></div>
      </div>

      <div id="s1-annonce" class="scene clip" data-composition-id="s1-annonce" data-composition-src="compositions/s1-annonce.html" data-start="0" data-duration="5.5" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="s2-villa" class="scene clip" data-composition-id="s2-villa" data-composition-src="compositions/s2-villa.html" data-start="5.5" data-duration="11" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="s3-cle" class="scene clip" data-composition-id="s3-cle" data-composition-src="compositions/s3-cle.html" data-start="16.5" data-duration="3.5" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="s4-preuve" class="scene clip" data-composition-id="s4-preuve" data-composition-src="compositions/s4-preuve.html" data-start="20" data-duration="6" data-track-index="1" data-width="1080" data-height="1920"></div>
      <div id="s5-final" class="scene clip" data-composition-id="s5-final" data-composition-src="compositions/s5-final.html" data-start="26" data-duration="6" data-track-index="1" data-width="1080" data-height="1920"></div>

      <div id="vf" class="clip" data-start="0" data-duration="32" data-track-index="2">
        <div id="vf-tl" class="vf-c"></div>
        <div id="vf-tr" class="vf-c"></div>
        <div id="vf-bl" class="vf-c"></div>
        <div id="vf-br" class="vf-c"></div>
        <div id="vf-rec"><span id="vf-dot"></span>REC</div>
        <div id="vf-brand">PAUL <b>DIGITAL</b></div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      // ambient background drift
      tl.fromTo("#bg-grid", { x: 0, y: 0 }, { x: -120, y: -69.28 * 3, duration: 32, ease: "none" }, 0);
      tl.fromTo("#bg-glow1", { scale: 1, x: 0 }, { scale: 1.25, x: -160, duration: 16, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);

      // viewfinder: corners rest at the frame edges; offsets move them onto a target rect
      const REST = { l: 56, t: 150, r: 1024, b: 1620 };
      const corner = (rect) => ({
        tl: { x: rect.l - REST.l, y: rect.t - REST.t },
        tr: { x: rect.r - REST.r, y: rect.t - REST.t },
        bl: { x: rect.l - REST.l, y: rect.b - REST.b },
        br: { x: rect.r - REST.r, y: rect.b - REST.b },
      });
      const moveTo = (rect, at, dur, ease) => {
        const c = corner(rect);
        ["tl", "tr", "bl", "br"].forEach((k) => tl.to("#vf-" + k, { x: c[k].x, y: c[k].y, duration: dur, ease }, at));
      };
      const CARD = { l: 92, t: 682, r: 988, b: 1338 };
      const big = corner({ l: -80, t: -80, r: 1160, b: 2000 });
      ["tl", "tr", "bl", "br"].forEach((k) => tl.fromTo("#vf-" + k, { x: big[k].x, y: big[k].y, opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 1.45));
      moveTo(CARD, 1.5, 0.55, "power3.out");
      tl.fromTo("#vf-rec", { opacity: 0 }, { opacity: 1, duration: 0.25 }, 1.9);
      tl.fromTo("#vf-dot", { opacity: 1 }, { opacity: 0.15, duration: 0.45, ease: "steps(1)", yoyo: true, repeat: 61 }, 2.0);
      moveTo(REST, 2.75, 0.6, "power3.inOut");
      tl.fromTo("#vf-brand", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 3.0);
      // close onto the logo at the end
      moveTo({ l: 80, t: 780, r: 1000, b: 1190 }, 29.55, 0.7, "expo.inOut");
      tl.to("#vf-brand", { opacity: 0, duration: 0.3 }, 29.5);
      tl.to("#vf-rec", { opacity: 0, duration: 0.3 }, 29.8);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
