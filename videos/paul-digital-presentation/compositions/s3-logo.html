<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s3-root { position: absolute; inset: 0; overflow: hidden; }
        #s3-all { position: absolute; inset: 0; }
        #s3-ring1, #s3-ring2 { position: absolute; left: 960px; top: 500px; width: 600px; height: 600px; margin: -300px 0 0 -300px; border-radius: 50%; border: 2px solid rgba(94,176,255,0.7); box-shadow: 0 0 40px rgba(61,134,255,0.5), inset 0 0 40px rgba(61,134,255,0.3); }
        #s3-glow { position: absolute; left: 960px; top: 500px; width: 900px; height: 900px; margin: -450px 0 0 -450px; border-radius: 50%; background: radial-gradient(circle, rgba(26,105,250,0.55) 0%, rgba(26,105,250,0) 65%); }
        #s3-lock { position: absolute; left: 0; top: 330px; width: 1920px; height: 340px; display: flex; align-items: center; justify-content: center; gap: 56px; }
        #s3-tile { position: relative; width: 300px; height: 300px; flex: none; border-radius: 76px; background: linear-gradient(145deg, rgba(255,255,255,0.22), rgba(255,255,255,0.06)); backdrop-filter: blur(26px); border: 2px solid rgba(255,255,255,0.35); box-shadow: 0 40px 100px rgba(0,4,20,0.6), 0 0 80px rgba(26,105,250,0.35), inset 0 2px 0 rgba(255,255,255,0.5); }
        #s3-d, #s3-arrow { position: absolute; left: 40px; top: 42px; width: 220px; height: 212px; }
        #s3-d { filter: brightness(0) invert(1); }
        #s3-arrow { filter: drop-shadow(0 0 14px rgba(26,105,250,0.9)); }
        #s3-word { position: relative; flex: none; width: 930px; height: 170px; overflow: hidden; }
        #s3-word span { position: absolute; top: 0; font-weight: 800; font-size: 150px; line-height: 170px; letter-spacing: -0.035em; white-space: nowrap; }
        #s3-paul { left: 0; color: #fff; }
        #s3-digital { left: 405px; color: #3D86FF; font-weight: 600 !important; }
        #s3-k { position: absolute; left: 0; top: 230px; width: 1920px; text-align: center; }
        #s3-pill { position: absolute; left: 960px; top: 720px; width: 600px; margin-left: -300px; height: 76px; border-radius: 38px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 28px; letter-spacing: 0.08em; color: #DCE8FF; background: linear-gradient(140deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05)); backdrop-filter: blur(20px); border: 1.5px solid rgba(255,255,255,0.28); white-space: nowrap; }
      </style>
      <div id="s3-root" data-composition-id="s3-logo" data-width="1920" data-height="1080">
        <div id="s3-all">
          <div id="s3-glow"></div>
          <div id="s3-ring1"></div>
          <div id="s3-ring2"></div>
          <div id="s3-k" class="kicker">C'est pour ça que j'ai créé</div>
          <div id="s3-lock" style="perspective:1600px">
            <div id="s3-tile">
              <img id="s3-d" src="assets/logo/mark-d.png" />
              <img id="s3-arrow" src="assets/logo/mark-arrow.png" />
            </div>
            <div id="s3-word"><span id="s3-paul">Paul</span><span id="s3-digital">Digital</span></div>
          </div>
          <div id="s3-pill">VIDÉOS &amp; SITES IMMOBILIERS</div>
        </div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          tl.from("#s3-all", { x: 1400, filter: "blur(30px)", duration: 0.5, ease: "power3.out" }, 0);
          tl.from("#s3-k", { opacity: 0, y: 20, duration: 0.5, ease: "power3.out" }, 0.15);
          tl.from("#s3-glow", { scale: 0.3, opacity: 0, duration: 1.0, ease: "expo.out" }, 0.3);
          // tile spins in, D drops, arrow snaps into its notch
          tl.from("#s3-tile", { rotationY: -160, rotationX: 30, scale: 0.4, opacity: 0, duration: 1.0, ease: "expo.out" }, 0.25);
          tl.from("#s3-d", { y: -60, opacity: 0, duration: 0.5, ease: "back.out(2)" }, 0.6);
          tl.from("#s3-arrow", { x: -70, y: 70, opacity: 0, duration: 0.45, ease: "back.out(2.6)" }, 0.95);
          // wordmark slides out from behind the tile (said ~1.8s)
          tl.from("#s3-word", { width: 0, duration: 0.8, ease: "expo.out" }, 1.45);
          tl.from("#s3-paul", { x: -160, duration: 0.8, ease: "expo.out" }, 1.45);
          tl.from("#s3-digital", { x: -380, opacity: 0, duration: 0.9, ease: "expo.out" }, 1.6);
          tl.from("#s3-pill", { opacity: 0, y: 30, scale: 0.8, duration: 0.6, ease: "back.out(2)" }, 2.0);
          // ring pulses on the reveal
          tl.fromTo("#s3-ring1", { scale: 0.5, opacity: 0.9 }, { scale: 2.4, opacity: 0, duration: 1.3, ease: "expo.out" }, 0.95);
          tl.fromTo("#s3-ring2", { scale: 0.5, opacity: 0.7 }, { scale: 2.0, opacity: 0, duration: 1.3, ease: "expo.out" }, 1.75);
          tl.to("#s3-tile", { rotationY: 14, duration: 1.8, ease: "sine.inOut" }, 1.3);
          // zoom-through exit into the next scene
          tl.to("#s3-all", { scale: 3.2, opacity: 0, filter: "blur(18px)", duration: 0.45, ease: "power3.in" }, 2.8);
          window.__timelines["s3-logo"] = PDScale(tl, 0.8125);
        })();
      </script>
    </template>
  </body>
</html>
