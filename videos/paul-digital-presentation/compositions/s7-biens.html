<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s7-root { position: absolute; inset: 0; overflow: hidden; }
        #s7-all { position: absolute; inset: 0; }
        #s7-wire { position: absolute; inset: 0; }
        #s7-slot { position: absolute; left: 960px; top: 880px; width: 560px; height: 104px; margin-left: -280px; border-radius: 52px; overflow: hidden; }
        #s7-slot .w { position: absolute; left: 0; top: 0; width: 560px; height: 104px; line-height: 104px; text-align: center; font-weight: 800; font-size: 52px; letter-spacing: -0.01em; white-space: nowrap; }
        #s7-copy { position: absolute; left: 0; top: 90px; width: 1920px; text-align: center; }
        #s7-copy .title { font-size: 84px; }
        #s7-idx { position: absolute; left: 960px; top: 1004px; margin-left: -60px; width: 120px; display: flex; gap: 10px; justify-content: center; }
        #s7-idx i { display: block; width: 18px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.25); }
      </style>
      <div id="s7-root" data-composition-id="s7-biens" data-width="1920" data-height="1080">
        <div id="s7-all">
          <canvas id="s7-wire" class="wire" width="1920" height="1080"></canvas>
          <div id="s7-copy"><div class="title"><span class="ln"><span id="s7-t">Je m'occupe <span class="blue">de tout.</span></span></span></div></div>
          <div id="s7-slot" class="glass">
            <div id="s7-w0" class="w">Appartement</div>
            <div id="s7-w1" class="w">Maison</div>
            <div id="s7-w2" class="w">Villa</div>
            <div id="s7-w3" class="w">Chalet</div>
          </div>
          <div id="s7-idx"><i id="s7-i0"></i><i id="s7-i1"></i><i id="s7-i2"></i><i id="s7-i3"></i></div>
        </div>
      </div>
      <script>
        (function () {
          const W = PDWire.create(document.getElementById("s7-wire"), { color: "#4DA3FF" });
          W.cam.yaw = -30; W.cam.pitch = 16; W.cam.dist = 36; W.cam.ty = 3.2; W.cam.fov = 40;
          const ms = [
            W.add(PDWire.models.apartment(), { s: 0.78, y: -0.5 }),
            W.add(PDWire.models.house(), { s: 1.15 }),
            W.add(PDWire.models.villa(), { s: 0.95, x: -1 }),
            W.add(PDWire.models.chalet(), { s: 1.0 }),
          ];
          W.start();
          const tl = gsap.timeline({ paused: true });
          tl.from("#s7-all", { scale: 0.5, opacity: 0, filter: "blur(20px)", duration: 0.45, ease: "power3.out" }, 0);
          // continuous orbit — the camera never stops while the property changes
          tl.fromTo(W.cam, { yaw: -40 }, { yaw: 120, duration: 4.3, ease: "none" }, 0);
          tl.fromTo(W.cam, { pitch: 12 }, { pitch: 24, duration: 4.3, ease: "sine.inOut" }, 0);
          const T = [0.05, 0.85, 1.45, 2.05];
          ms.forEach((m, i) => {
            tl.to(m, { draw: 1, duration: i === 3 ? 0.9 : 0.55, ease: "power2.out" }, T[i]);
            if (i < 3) {
              tl.to(m, { alpha: 0, sy: 0.02, duration: 0.25, ease: "power2.in" }, T[i + 1] - 0.05);
            }
            // word slot: each word slides up into place
            if (i > 0) tl.fromTo("#s7-w" + i, { yPercent: 100 }, { yPercent: 0, duration: 0.35, ease: "expo.out" }, T[i]);
            if (i < 3) tl.to("#s7-w" + i, { yPercent: -100, duration: 0.35, ease: "expo.out" }, T[i + 1]);
            tl.to("#s7-i" + i, { background: "#3D86FF", width: 36, duration: 0.2 }, T[i]);
          });
          tl.set(["#s7-w1", "#s7-w2", "#s7-w3"], { yPercent: 100 }, 0);
          tl.from("#s7-t", { yPercent: 110, duration: 0.7, ease: "expo.out" }, 2.6);
          tl.to(W.scene, { glow: 1.8, duration: 0.3, yoyo: true, repeat: 1 }, 2.9);
          // whip right
          tl.to("#s7-all", { x: 1600, filter: "blur(26px)", opacity: 0, duration: 0.4, ease: "power3.in" }, 3.9);
          window.__timelines["s7-biens"] = PDScale(tl, 1.0);
        })();
      </script>
    </template>
  </body>
</html>
