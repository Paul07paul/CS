<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <script src="assets/wire.js"></script>
    <style>
      @font-face { font-family: "Montserrat"; font-style: normal; font-weight: 100 900; src: url("assets/fonts/montserrat.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #070D1A; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #070D1A; font-family: "Montserrat", sans-serif; color: #F2F6FF; }

      /* ---- shared design system (used by every scene) ---- */
      .abs { position: absolute; }
      .stage3d { position: absolute; inset: 0; perspective: 1700px; perspective-origin: 50% 45%; }
      .p3 { position: absolute; transform-style: preserve-3d; }
      .glass {
        position: absolute; border-radius: 28px;
        background: linear-gradient(140deg, rgba(255,255,255,0.16), rgba(255,255,255,0.05));
        backdrop-filter: blur(24px) saturate(1.4);
        border: 1.5px solid rgba(255,255,255,0.22);
        box-shadow: 0 30px 80px rgba(0,6,24,0.55), inset 0 1px 0 rgba(255,255,255,0.35);
      }
      .glass-light {
        position: absolute; border-radius: 28px;
        background: linear-gradient(140deg, rgba(255,255,255,0.86), rgba(255,255,255,0.55));
        backdrop-filter: blur(22px) saturate(1.5);
        border: 1.5px solid rgba(255,255,255,0.95);
        box-shadow: 0 24px 60px rgba(12,25,41,0.22), inset 0 1px 0 #fff;
        color: #0C1929;
      }
      .chip {
        position: absolute; height: 72px; border-radius: 36px; padding: 0 30px 0 10px;
        display: flex; align-items: center; gap: 14px; white-space: nowrap;
        font-weight: 700; font-size: 27px; color: #F2F6FF;
        background: linear-gradient(140deg, rgba(255,255,255,0.2), rgba(255,255,255,0.07));
        backdrop-filter: blur(18px); border: 1.5px solid rgba(255,255,255,0.3);
        box-shadow: 0 16px 40px rgba(0,6,24,0.45), inset 0 1px 0 rgba(255,255,255,0.4);
      }
      .chip .ic { width: 52px; height: 52px; border-radius: 26px; display: flex; align-items: center; justify-content: center; flex: none; background: #1A69FA; box-shadow: 0 0 22px rgba(26,105,250,0.7); }
      .chip svg { width: 28px; height: 28px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .kicker { font-weight: 700; font-size: 24px; letter-spacing: 0.32em; text-transform: uppercase; color: #7FB6FF; white-space: nowrap; }
      .title { font-weight: 800; font-size: 96px; line-height: 1.02; letter-spacing: -0.03em; color: #F2F6FF; }
      .blue { color: #3D86FF; }
      .ln { display: block; overflow: hidden; padding-bottom: 0.06em; }
      .ln > span { display: block; }
      .photo { position: absolute; overflow: hidden; }
      .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      canvas.wire { position: absolute; inset: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="65" data-width="1920" data-height="1080">
      <!-- persistent world: dark navy, moving glows, wireframe floor -->
      <div id="bg" data-composition-id="bg" data-composition-src="compositions/bg.html" data-start="0" data-duration="65" data-track-index="0" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- scenes -->
      <div id="s1" data-composition-id="s1-annonces" data-composition-src="compositions/s1-annonces.html" data-start="0" data-duration="8.4" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s2" data-composition-id="s2-histoire" data-composition-src="compositions/s2-histoire.html" data-start="8.2" data-duration="6.0" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s3" data-composition-id="s3-logo" data-composition-src="compositions/s3-logo.html" data-start="14.0" data-duration="3.2" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s4" data-composition-id="s4-video" data-composition-src="compositions/s4-video.html" data-start="17.0" data-duration="9.0" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s5" data-composition-id="s5-site" data-composition-src="compositions/s5-site.html" data-start="25.8" data-duration="8.6" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s6" data-composition-id="s6-cibles" data-composition-src="compositions/s6-cibles.html" data-start="34.2" data-duration="8.0" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s7" data-composition-id="s7-biens" data-composition-src="compositions/s7-biens.html" data-start="42.0" data-duration="4.3" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s8" data-composition-id="s8-supports" data-composition-src="compositions/s8-supports.html" data-start="46.1" data-duration="7.1" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s9" data-composition-id="s9-objectif" data-composition-src="compositions/s9-objectif.html" data-start="53.0" data-duration="5.8" data-track-index="1" data-track-kind="graphics" data-width="1920" data-height="1080"></div>
      <div id="s10" data-composition-id="s10-final" data-composition-src="compositions/s10-final.html" data-start="58.6" data-duration="6.4" data-track-index="2" data-track-kind="graphics" data-width="1920" data-height="1080"></div>

      <!-- audio -->
      <audio id="vo" src="assets/audio/vo.wav" data-start="0" data-duration="65" data-track-index="10" data-volume="1"></audio>
      <audio id="music" src="assets/audio/music.wav" data-start="0" data-duration="65" data-track-index="11" data-volume="1"></audio>
      <audio id="sfx" src="assets/audio/sfx.wav" data-start="0" data-duration="65" data-track-index="12" data-volume="1"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
