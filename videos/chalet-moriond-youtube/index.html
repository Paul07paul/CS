<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Cormorant Garamond"; font-style: normal; font-weight: 400 600; src: url("assets/fonts/cormorant.woff2") format("woff2"); }
      @font-face { font-family: "Cormorant Garamond"; font-style: italic; font-weight: 400 600; src: url("assets/fonts/cormorant-italic.woff2") format("woff2"); }
      @font-face { font-family: "Montserrat"; font-style: normal; font-weight: 100 900; src: url("assets/fonts/montserrat.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #07080B; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #07080B; font-family: "Montserrat", sans-serif; color: #fff; }
      .scene { position: absolute; inset: 0; overflow: hidden; }
      .abs { position: absolute; }
      .full { position: absolute; inset: 0; }
      .photo { position: absolute; overflow: hidden; }
      .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .cone { position: absolute; left: 360px; top: -420px; width: 1200px; height: 1100px; background: radial-gradient(ellipse at 50% 30%, rgba(255,238,214,0.34) 0%, rgba(255,214,170,0.12) 35%, rgba(255,214,170,0) 70%); }
      .floor { position: absolute; left: 0; right: 0; bottom: 0; height: 360px; background: linear-gradient(180deg, rgba(7,8,11,0) 0%, rgba(7,8,11,0.9) 100%); }
      .glass { position: absolute; border-radius: 36px; background: linear-gradient(180deg, rgba(255,255,255,0.11), rgba(255,255,255,0.035)); border: 1.5px solid rgba(255,255,255,0.17); box-shadow: 0 0 70px rgba(255,186,110,0.10), inset 0 1px 0 rgba(255,255,255,0.22); }
      .pill { position: absolute; height: 84px; border-radius: 42px; background: linear-gradient(180deg, rgba(255,255,255,0.13), rgba(255,255,255,0.04)); border: 1.5px solid rgba(255,255,255,0.22); box-shadow: 0 0 40px rgba(255,186,110,0.14), inset 0 1px 0 rgba(255,255,255,0.25); white-space: nowrap; font-weight: 700; font-size: 30px; line-height: 81px; padding: 0 36px; }
      .pill i { display: inline-block; width: 14px; height: 14px; border-radius: 7px; background: #FFB86B; box-shadow: 0 0 14px #FFB86B; margin-right: 16px; vertical-align: 3px; }
      .glow { text-shadow: 0 0 28px rgba(255,200,140,0.55), 0 0 2px rgba(255,255,255,0.6); }
      .glow-blue { text-shadow: 0 0 30px rgba(120,190,255,0.75), 0 0 2px rgba(255,255,255,0.7); }
      .glow-ember { text-shadow: 0 0 30px rgba(255,120,60,0.75), 0 0 2px rgba(255,255,255,0.7); }
      .k { font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; line-height: 0.95; white-space: nowrap; }
      .it { font-family: "Cormorant Garamond", serif; font-style: italic; font-weight: 500; white-space: nowrap; }
      .kick { font-weight: 600; font-size: 24px; letter-spacing: 0.38em; text-transform: uppercase; white-space: nowrap; color: #FFC88E; }
      .amber { color: #FFC88E; }
      .num { font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.03em; line-height: 1; white-space: nowrap; }
      .shade-l { position: absolute; left: 0; top: 0; bottom: 0; width: 1150px; background: linear-gradient(90deg, rgba(7,8,11,0.88) 0%, rgba(7,8,11,0.55) 55%, rgba(7,8,11,0) 100%); }
      .shade-b { position: absolute; left: 0; right: 0; bottom: 0; height: 520px; background: linear-gradient(180deg, rgba(7,8,11,0) 0%, rgba(7,8,11,0.85) 100%); }
      .card { position: absolute; overflow: hidden; border-radius: 26px; box-shadow: 0 30px 70px rgba(0,0,0,0.5); }
      .card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .tag { position: absolute; left: 22px; bottom: 22px; height: 46px; padding: 0 18px; border-radius: 23px; background: rgba(7,8,11,0.72); font-weight: 700; font-size: 20px; letter-spacing: 0.08em; line-height: 46px; white-space: nowrap; }
      .ring-stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; perspective: 1700px; }
      .ring { position: absolute; left: 960px; top: 540px; width: 0; height: 0; transform-style: preserve-3d; }
      .ring span { position: absolute; left: -30px; top: -50px; width: 60px; height: 100px; text-align: center; font-weight: 800; font-size: 84px; line-height: 100px; color: #FFFFFF; backface-visibility: hidden; text-shadow: 0 0 22px rgba(255,200,140,0.6); }
      .dot { position: absolute; border-radius: 50%; background: #FFE2BF; }
      #flash { position: absolute; inset: 0; background: #FFF6EA; pointer-events: none; }
      .ico { position: absolute; color: #FFC88E; fill: none; stroke: currentColor; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="99" data-width="1920" data-height="1080">
      <div id="s1" class="scene clip" data-start="0" data-duration="7.3" data-track-index="1"></div>
      <div id="s2" class="scene clip" data-start="7" data-duration="8.3" data-track-index="2"></div>
      <div id="s3" class="scene clip" data-start="15" data-duration="10.3" data-track-index="1"></div>
      <div id="s4" class="scene clip" data-start="25" data-duration="10.3" data-track-index="2"></div>
      <div id="s5" class="scene clip" data-start="35" data-duration="7.3" data-track-index="1"></div>
      <div id="s6" class="scene clip" data-start="42" data-duration="12.3" data-track-index="2"></div>
      <div id="s7" class="scene clip" data-start="54" data-duration="6.3" data-track-index="1"></div>
      <div id="s8" class="scene clip" data-start="60" data-duration="10.3" data-track-index="2"></div>
      <div id="s9" class="scene clip" data-start="70" data-duration="5.3" data-track-index="1"></div>
      <div id="s10" class="scene clip" data-start="75" data-duration="7.3" data-track-index="2"></div>
      <div id="s11" class="scene clip" data-start="82" data-duration="6.3" data-track-index="1"></div>
      <div id="s12" class="scene clip" data-start="88" data-duration="7.8" data-track-index="2"></div>
      <div id="s13" class="scene clip" data-start="95.5" data-duration="3.5" data-track-index="1" style="background:#F4F1EC"></div>
      <div id="leak" class="clip" data-start="7" data-duration="88.5" data-track-index="4" style="position:absolute;inset:0;pointer-events:none;mix-blend-mode:screen"><div id="leak-b" style="position:absolute;left:-700px;top:-200px;width:1100px;height:1100px;border-radius:50%;background:radial-gradient(circle, rgba(255,170,90,0.22) 0%, rgba(255,170,90,0) 65%)"></div></div>
      <div id="chap" class="clip" data-start="7" data-duration="81" data-track-index="5" style="position:absolute;left:64px;top:52px;width:700px;height:60px;pointer-events:none"></div>
      <div id="prog" class="clip" data-start="7" data-duration="88.5" data-track-index="6" style="position:absolute;left:0;right:0;bottom:0;height:5px;pointer-events:none"><div id="prog-bar" style="position:absolute;left:0;top:0;bottom:0;width:1920px;background:linear-gradient(90deg,#FFB86B,#FFE2BF);transform-origin:0% 50%;box-shadow:0 0 12px rgba(255,184,107,0.8)"></div></div>
      <div id="flash" class="clip" data-start="0" data-duration="99" data-track-index="3"></div>
      <audio id="sfx" src="assets/audio/sfx.wav" data-start="0" data-duration="99" data-track-index="11" data-volume="1"></audio>
    </div>

    <script>
      // ================= helpers =================
      const $ = (id) => document.getElementById(id);
      const H = (id, html) => ($(id).innerHTML = html);
      const photo = (src, style, imgStyle, id) => `<div class="photo" ${id ? `id="${id}"` : ""} style="${style}"><img src="assets/photos/${src}.jpg" style="${imgStyle || ""}" alt="" /></div>`;
      const card = (src, x, y, w, h, tag, id) => `<div class="card" id="${id}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><img src="assets/photos/${src}.jpg" alt="" />${tag ? `<div class="tag">${tag}</div>` : ""}</div>`;
      const pill = (id, x, y, html, extra) => `<div class="pill" id="${id}" style="left:${x}px;top:${y}px;${extra || ""}"><i></i>${html}</div>`;
      const dots = (n, seed, color) => Array.from({ length: n }, (_, k) => {
        const s = 2 + ((k * 7 + seed) % 5);
        return `<div class="dot" data-k="${k}" style="left:${(k * 197 + seed * 53) % 1920}px;top:${(k * 131 + seed * 29) % 1080}px;width:${s}px;height:${s}px;opacity:${0.25 + ((k * 13) % 7) / 12};${color ? "background:" + color : ""}"></div>`;
      }).join("");
      const ICONS = {
        kitchen: '<path d="M12 6 v9 a4 4 0 0 0 8 0 V6 M16 6 v9 M16 19 v23"/><path d="M32 42 V6 c5 2 7 9 7 15 h-7"/>',
        wifi: '<path d="M6 19 a26 26 0 0 1 36 0 M12 26 a17 17 0 0 1 24 0 M18 33 a8 8 0 0 1 12 0"/><circle cx="24" cy="39" r="2.4" fill="currentColor"/>',
        park: '<rect x="9" y="7" width="30" height="34" rx="6"/><path d="M19 33 V16 h7 a6 6 0 0 1 0 12 h-7"/>',
        pool: '<path d="M16 32 V11 a4 4 0 0 1 8 0 M28 32 V11 a4 4 0 0 1 8 0 M16 18 h12 M16 25 h12"/><path d="M4 37 c4 -3 8 3 12 0 s8 3 12 0 s8 3 12 0 s4 3 6 0 M4 44 c4 -3 8 3 12 0 s8 3 12 0 s8 3 12 0 s4 3 6 0"/>',
        sauna: '<path d="M18 8 a4 4 0 0 1 8 0 v19 a8 8 0 1 1 -8 0 z"/><path d="M22 30 V18"/><path d="M33 12 c-3 3 3 5 0 8 M40 12 c-3 3 3 5 0 8"/>',
        tv: '<rect x="5" y="9" width="38" height="25" rx="3"/><path d="M17 41 h14 M24 34 v7"/>',
        wash: '<rect x="8" y="5" width="32" height="38" rx="4"/><circle cx="24" cy="26" r="9"/><path d="M13 11 h6"/>',
        balcony: '<path d="M6 20 l9 -11 7 7 6 -7 14 11"/><path d="M5 27 h38 M5 42 h38 M9 27 v15 M17 27 v15 M25 27 v15 M33 27 v15 M41 27 v15"/>',
        clock: '<circle cx="24" cy="24" r="18"/><path d="M24 13 v12 l8 5"/>',
        door: '<path d="M10 42 V6 h22 v36 M32 24 h12 M38 18 l6 6 -6 6"/><circle cx="26" cy="25" r="1.6" fill="currentColor"/>',
        bolt: '<path d="M27 4 L10 27 h12 l-3 17 L38 20 H26 z"/>',
        people: '<circle cx="17" cy="16" r="6"/><circle cx="33" cy="18" r="5"/><path d="M5 40 c0 -8 6 -13 12 -13 s12 5 12 13 M29 40 c0 -6 4 -10 9 -10 s7 4 7 10"/>',
        chat: '<path d="M6 8 h36 v24 H20 l-10 8 v-8 H6 z"/>',
      };
      const ico = (name, x, y, s, id) => `<svg class="ico" ${id ? `id="${id}"` : ""} viewBox="0 0 48 48" style="left:${x}px;top:${y}px;width:${s}px;height:${s}px">${ICONS[name]}</svg>`;

      // ================= S1 · intro (letter reveal + window opening on the mountains) =================
      H("s1", `<div class="cone" id="s1-cone"></div><div class="full" id="s1-dots">${dots(60, 3)}</div>
        ${photo("w14", "left:0;top:0;width:1920px;height:1080px", "object-position:50% 40%", "s1-win")}
        <div class="full" id="s1-titles">
          <div class="abs kick" id="s1-k" style="left:0;right:0;top:290px;text-align:center">Location de prestige</div>
          <div class="abs k glow" id="s1-t1" style="left:0;right:0;top:350px;text-align:center;font-size:200px;letter-spacing:0.14em">${"CHALET".split("").map((c) => `<span style="display:inline-block">${c}</span>`).join("")}</div>
          <svg class="abs" viewBox="0 0 1920 20" style="left:0;top:590px;width:1920px;height:20px"><line id="s1-line" x1="760" y1="10" x2="1160" y2="10" stroke="#FFC88E" stroke-width="3" /></svg>
          <div class="abs it amber" id="s1-t2" style="left:0;right:0;top:625px;text-align:center;font-size:88px">Courchevel Moriond</div>
          <div class="abs kick" id="s1-t3" style="left:0;right:0;top:760px;text-align:center;color:#fff">Jusqu'à 12 voyageurs · 4 suites · piscine &amp; sauna</div>
        </div>
        <div class="floor" id="s1-floor"></div>`);

      // ================= S2 · location =================
      H("s2", `${photo("w01", "left:0;top:0;width:1920px;height:1080px", "", "s2-ph")}<div class="shade-l"></div>
        <div class="abs kick" id="s2-k" style="left:120px;top:300px">Emplacement idéal</div>
        <div class="abs k glow" id="s2-t1" style="left:116px;top:360px;font-size:120px">À deux pas</div>
        <div class="abs it amber" id="s2-t2" style="left:122px;top:490px;font-size:84px">des pistes &amp; des commerces</div>
        <div class="glass" id="s2-map" style="left:1210px;top:220px;width:590px;height:640px;overflow:hidden;background:linear-gradient(180deg, rgba(14,14,18,0.9), rgba(10,10,14,0.82))">
          <svg viewBox="0 0 590 640" width="590" height="640" style="position:absolute;left:0;top:0">
            <path id="s2-m1" d="M -10 470 L 90 360 L 160 410 L 260 250 L 330 320 L 420 180 L 500 290 L 600 230" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="4" stroke-linejoin="round"/>
            <path id="s2-m2" d="M -10 540 L 120 450 L 230 500 L 340 400 L 450 470 L 600 390" fill="none" stroke="rgba(255,200,142,0.55)" stroke-width="3" stroke-linejoin="round"/>
            <path id="s2-road" d="M 60 640 C 160 560, 220 560, 300 470 S 420 380, 470 300" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 18"/>
          </svg>
          <div class="abs" id="s2-pulse" style="left:255px;top:425px;width:80px;height:80px;border-radius:50%;border:3px solid #FFB86B"></div>
          <svg class="abs" id="s2-pin" viewBox="0 0 60 80" style="left:265px;top:385px;width:60px;height:80px"><path d="M30 78 C30 78 3 46 3 29 A27 27 0 0 1 57 29 C57 46 30 78 30 78 Z" fill="#FFB86B"/><circle cx="30" cy="29" r="10" fill="#07080B"/></svg>
          <div class="abs kick" style="left:40px;top:42px;color:#fff">Courchevel</div>
          <div class="abs it amber" style="left:40px;top:80px;font-size:52px">Moriond</div>
          <div class="pill" id="s2-p1" style="left:40px;top:520px;height:64px;line-height:61px;font-size:24px;padding:0 24px"><i></i>Pistes à deux pas</div>
          <div class="pill" id="s2-p2" style="left:310px;top:430px;height:64px;line-height:61px;font-size:24px;padding:0 24px;display:none"></div>
        </div>
        <div class="pill" id="s2-p3" style="left:120px;top:640px"><i></i>Commerces à proximité</div>`);

      // ================= S3 · dashboard (figures + rating) =================
      H("s3", `<div class="cone" id="s3-cone" style="left:360px"></div><div class="full" id="s3-dots">${dots(50, 7)}</div>
        <div class="abs kick" id="s3-k" style="left:0;right:0;top:120px;text-align:center">Le chalet en chiffres</div>
        <div id="s3-figs"></div>
        <div class="glass" id="s3-score" style="left:610px;top:560px;width:700px;height:300px">
          <div class="abs kick" style="left:0;right:0;top:40px;text-align:center;color:#fff">Note des voyageurs</div>
          <div class="abs num glow" style="left:0;right:0;top:90px;text-align:center;font-size:150px"><span id="s3-score-n">0,00</span><span class="amber" style="font-size:96px"> ★</span></div>
        </div>
        <svg class="abs" viewBox="0 0 1920 1080" style="left:0;top:0;width:1920px;height:1080px"><path id="s3-bracket" d="M 960 860 V 900 M 470 940 V 900 H 1450 V 940" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="3"/></svg>
        ${pill("s3-b1", 300, 950, "168 évaluations")}${pill("s3-b2", 790, 950, "Réservation instantanée")}${pill("s3-b3", 1290, 950, "Répond dans l'heure")}`);
      const FIGS = [[12, "voyageurs", "people"], [4, "chambres en suite", "door"], [1, "dortoir mansardé", "people"], [4, "salles d'eau", "wash"]];
      $("s3-figs").innerHTML = FIGS.map(([v, l, ic], i) => `<div class="glass" id="s3-f${i}" style="left:${120 + i * 430}px;top:200px;width:400px;height:300px">
          ${ico(ic, 40, 40, 56)}
          <div class="abs num glow" style="left:40px;top:116px;font-size:120px" id="s3-n${i}">0</div>
          <div class="abs" style="left:42px;top:240px;font-weight:600;font-size:28px;color:#E9DCCB;white-space:nowrap">${l}</div></div>`).join("");

      // ================= S4 · salon =================
      H("s4", `${photo("w01", "left:0;top:0;width:1920px;height:1080px", "object-position:50% 50%", "s4-a")}${photo("w03", "left:0;top:0;width:1920px;height:1080px", "object-position:50% 50%", "s4-b")}
        <div class="shade-b"></div><div class="shade-l" style="width:900px;opacity:0.7"></div>
        <div class="abs kick" id="s4-k" style="left:120px;top:700px">Le salon</div>
        <div class="abs k glow" id="s4-t1" style="left:116px;top:750px;font-size:104px">Spacieux</div>
        <div class="abs it amber" id="s4-t2" style="left:122px;top:860px;font-size:80px">&amp; chaleureux</div>
        <div class="abs k glow" id="s4-t3" style="left:116px;top:750px;font-size:96px">Des vues</div>
        <div class="abs it amber" id="s4-t4" style="left:122px;top:852px;font-size:80px">à couper le souffle</div>
        ${pill("s4-p1", 1300, 860, "Cheminée")}${pill("s4-p2", 1300, 760, "Vue sur les sommets")}
        ${card("c17", 1380, 150, 460, 306, "Coin salon", "s4-c")}`);

      // ================= S5 · cuisine =================
      H("s5", `${photo("w02", "left:0;top:0;width:1920px;height:1080px", "", "s5-ph")}<div class="shade-l"></div>
        <div class="abs kick" id="s5-k" style="left:120px;top:330px">La cuisine</div>
        <div class="abs k glow" id="s5-t1" style="left:116px;top:390px;font-size:110px">Ouverte</div>
        <div class="abs it amber" id="s5-t2" style="left:122px;top:510px;font-size:84px">parfaitement équipée</div>
        ${pill("s5-p1", 120, 650, "Îlot central")}${pill("s5-p2", 440, 650, "Espace repas convivial")}
        ${card("c19", 1330, 600, 480, 320, "Cuisine", "s5-c")}`);

      // ================= S6 · chambres (colour block) =================
      H("s6", `<div class="full" style="background:#0E2A5C"></div><div class="full" style="background:radial-gradient(ellipse at 20% 30%, rgba(120,170,255,0.35), rgba(14,42,92,0) 60%)"></div>
        <div class="abs num glow-blue" id="s6-n" style="left:110px;top:150px;font-size:300px">4</div>
        <div class="abs k" id="s6-t1" style="left:320px;top:205px;font-size:78px">CHAMBRES</div>
        <div class="abs it" id="s6-t2" style="left:326px;top:292px;font-size:72px;color:#BBD5FF">en suite</div>
        <div class="abs" id="s6-l" style="left:116px;top:470px;width:640px;font-weight:500;font-size:32px;line-height:1.45;color:#DDE8FF;white-space:normal">Chacune avec sa salle d'eau privative, dans le bois et la lumière.</div>
        <div id="s6-grid" style="position:absolute;left:0;top:0;width:1920px;height:1080px;perspective:1800px">
          ${card("c04", 900, 120, 450, 310, "Chambre 1", "s6-c1")}${card("c05", 1380, 120, 450, 310, "Chambre 2", "s6-c2")}
          ${card("c06", 900, 460, 450, 310, "Chambre 3", "s6-c3")}${card("c07", 1380, 460, 450, 310, "Chambre 4", "s6-c4")}
        </div>
        <div id="s6-dorm" class="full">
          ${card("w08", 860, 120, 970, 650, "Dortoir mansardé", "s6-d")}
          <div class="abs k" id="s6-t3" style="left:116px;top:650px;font-size:84px">+ UN DORTOIR</div>
          <div class="abs it" id="s6-t4" style="left:122px;top:740px;font-size:72px;color:#BBD5FF">mansardé, sous les poutres</div>
        </div>
        ${pill("s6-p", 860, 850, "Parfait pour accueillir famille &amp; amis", "background:rgba(255,255,255,0.12)")}`);

      // ================= S7 · salles d'eau (colour block) =================
      H("s7", `<div class="full" style="background:#3A2A1E"></div><div class="full" style="background:radial-gradient(ellipse at 80% 20%, rgba(255,190,120,0.3), rgba(58,42,30,0) 60%)"></div>
        <div class="abs num glow" id="s7-n" style="left:110px;top:170px;font-size:300px">4</div>
        <div class="abs k" id="s7-t1" style="left:330px;top:220px;font-size:92px">SALLES D'EAU</div>
        <div class="abs it amber" id="s7-t2" style="left:336px;top:318px;font-size:76px">une pour chaque suite</div>
        ${card("c09", 110, 520, 410, 280, "Douche à l'italienne", "s7-c1")}${card("c10", 550, 520, 410, 280, "Double vasque", "s7-c2")}
        ${card("c11", 990, 520, 410, 280, "", "s7-c3")}${card("c12", 1430, 520, 380, 280, "", "s7-c4")}`);

      // ================= S8 · bien-être =================
      H("s8", `<div class="full" style="background:#04101C"></div>
        ${photo("w15", "left:0;top:0;width:1920px;height:1080px", "", "s8-pool")}
        <div class="full" style="background:linear-gradient(90deg, rgba(4,16,28,0.85), rgba(4,16,28,0.2) 60%)" id="s8-shade"></div>

        tl.fromTo("#s10-a" + i + " .s10-ico path, #s10-a" + i + " .s10-ico rect, #s10-a" + i + " .s10-ico circle", { strokeDasharray: 1, strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.9, ease: "power2.inOut" }, 76.2 + i * 0.2);
        tl.fromTo("#s10-a" + i + " .badge", { scale: 0.4, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "back.out(1.8)" }, 76.1 + i * 0.2);
      });
      exitScene("#s10", 81.7, "up");

      // S11 · infos pratiques 82–88
      enterScene("#s11", 82, "up");
      rise("#s11-k", 82.3);
      INFO.forEach((_, i) => tl.fromTo("#s11-i" + i, { opacity: 0, rotationX: -60, y: 60, transformPerspective: 1400 }, { opacity: 1, rotationX: 0, y: 0, duration: 0.6, ease: "power4.out" }, 82.6 + i * 0.25));
      pop("#s11-p", 84.0);
      exitScene("#s11", 87.7, "zoom");

      // S12 · famille & amis + booking 88–95.8
      kb("#s12-ph", 88, 7.8, { scale: 1.15 }, { scale: 1.0 });
      tl.fromTo("#s12-t1", { opacity: 0, scale: 1.4, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.8, ease: "power4.out" }, 88.3);
      rise("#s12-t2", 88.8, 0.7); rise("#s12-t3", 89.3, 0.7);
      out(["#s12-t1", "#s12-t2", "#s12-t3"], 91.0);
      tl.to("#s12-dim", { opacity: 1, backgroundColor: "rgba(7,8,11,0.72)", duration: 0.4 }, 91.0);
      tl.fromTo("#book", { opacity: 0, y: 160, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.7, ease: "power4.out" }, 91.3);
      tl.fromTo("#cursor", { x: 900, y: 700, opacity: 0 }, { x: 420, y: 540, opacity: 1, duration: 0.8, ease: "power2.inOut" }, 92.2);
      tl.fromTo("#book-btn", { scale: 1 }, { scale: 0.96, duration: 0.12, ease: "power2.out", yoyo: true, repeat: 1 }, 93.1);
      tl.fromTo("#book-rip", { scale: 0, opacity: 1 }, { scale: 26, opacity: 0, duration: 0.8, ease: "power2.out" }, 93.15);
      tl.fromTo("#btn-a", { opacity: 1, y: 0 }, { opacity: 0, y: -34, duration: 0.25, ease: "power2.in", immediateRender: false }, 93.3);
      tl.fromTo("#btn-b", { opacity: 0, y: 34 }, { opacity: 1, y: 0, duration: 0.3, ease: "back.out(2)", immediateRender: false }, 93.45);
      tl.to("#book", { opacity: 0, y: -30, duration: 0.3, ease: "power1.in" }, 95.2);

      // S13 · signature 95.5–99
      tl.fromTo("#s13", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "sine.inOut" }, 95.5);
      rise("#s13-by", 95.7);
      tl.fromTo("#s13-d", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.6, ease: "expo.out" }, 95.8);
      tl.fromTo("#s13-a", { x: -70, y: 70, opacity: 0 }, { x: 0, y: 0, opacity: 1, duration: 0.55, ease: "back.out(1.6)" }, 95.95);
      tl.fromTo("#s13-wp", { y: 130 }, { y: 0, duration: 0.55, ease: "power4.out" }, 96.1);
      tl.fromTo("#s13-wd", { y: 130 }, { y: 0, duration: 0.55, ease: "power4.out" }, 96.25);
      tl.fromTo("#s13-mark", { scale: 1 }, { scale: 1.03, duration: 2.0, ease: "sine.inOut" }, 96.8);

      // ---- ambient layer: warm light leak drifting across, progress line
      tl.fromTo("#leak-b", { x: 0, y: 0 }, { x: 2400, y: 300, duration: 44, ease: "sine.inOut", yoyo: true, repeat: 1 }, 7);
      tl.fromTo("#prog-bar", { scaleX: 0 }, { scaleX: 1, duration: 88.5, ease: "none" }, 7);
      // ---- chapter tag: number + line + label, swapped at every scene
      const CH = [[7, "01", "Emplacement"], [15, "02", "En chiffres"], [25, "03", "Le salon"], [35, "04", "La cuisine"], [42, "05", "Les chambres"], [54, "06", "Salles d'eau"], [60, "07", "Bien-être"], [70, "08", "Extérieur"], [75, "09", "Équipements"], [82, "10", "Infos pratiques"]];
      $("chap").innerHTML = CH.map(([t, n, l], i) => `<div id="ch${i}" style="position:absolute;left:0;top:0;white-space:nowrap;text-shadow:0 2px 14px rgba(0,0,0,0.6)"><span style="font-weight:800;font-size:30px;color:#FFC88E">${n}</span><span class="chl" style="display:inline-block;width:70px;height:2px;background:#FFC88E;margin:0 18px;vertical-align:8px;transform-origin:0 50%"></span><span style="font-weight:600;font-size:24px;letter-spacing:0.3em;text-transform:uppercase">${l}</span></div>`).join("");
      CH.forEach(([t], i) => {
        tl.fromTo("#ch" + i, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, t + 0.3);
        tl.fromTo("#ch" + i + " .chl", { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, t + 0.45);
        const end = i + 1 < CH.length ? CH[i + 1][0] - 0.35 : 87.6;
        tl.to("#ch" + i, { opacity: 0, x: 20, duration: 0.3, ease: "power2.in" }, end);
      });
      // ---- gentle sway on cards, pills and widgets (rotation only, independent of their entrances)
      document.querySelectorAll(".scene .card, .scene .pill, .scene .glass").forEach((el, k) => {
        if (el.id === "s4-c" || el.id === "s5-c") return;
        const sc = el.closest(".scene");
        const st = parseFloat(sc.dataset.start), du = parseFloat(sc.dataset.duration);
        tl.fromTo(el, { rotation: -0.6 * ((k % 2) ? 1 : -1) }, { rotation: 0.6 * ((k % 2) ? 1 : -1), duration: 1.9 + (k % 3) * 0.3, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor(du / 2)) }, st);
      });

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
