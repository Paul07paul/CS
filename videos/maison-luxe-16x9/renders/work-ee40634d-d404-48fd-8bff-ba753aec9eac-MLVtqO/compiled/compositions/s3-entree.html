<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s3-root { position: absolute; inset: 0; overflow: hidden; }
        #s3-a { left: 1250px; }
        #s3-b { left: 1250px; }
        #s3-k { left: 150px; top: 330px; }
        #s3-l1 { left: 150px; top: 390px; }
        #s3-arrow { position: absolute; left: 720px; top: 330px; width: 60px; height: 150px; }
        #s3-arrow path { fill: none; stroke: #F2C77A; stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 10px #FFAA33); }
        #s3-c1 { left: 150px; top: 600px; }
        #s3-c2 { left: 150px; top: 710px; }
      </style>
      <div id="s3-root" data-composition-id="s3-entree" data-width="1920" data-height="1080">
        <video id="s3-bgv" class="bgv" src="assets/bg/foyer-s.mp4" muted playsinline data-start="0" data-duration="8.7" data-end="8.7" data-has-audio="false"></video>
        <div class="shade"></div>
        <div class="stage3d">
          <div id="s3-a" class="card">
            <video id="s3-va" src="assets/clips/foyer-s.mp4" muted playsinline data-start="0" data-duration="8.7" data-end="8.7" data-has-audio="false"></video>
            <div id="s3-sha" class="sheen"></div>
          </div>
          <div id="s3-b" class="card">
            <video id="s3-vb" src="assets/clips/salon.mp4" muted playsinline data-start="6.35" data-duration="2.35" data-end="8.7" data-has-audio="false"></video>
            <div id="s3-shb" class="sheen"></div>
          </div>
        </div>
        <div id="s3-k" class="kicker">Dès l'entrée</div>
        <div id="s3-l1" class="ln say"><span id="s3-t1">le regard <b>s'élève</b></span></div>
        <svg id="s3-arrow" viewBox="0 0 60 150"><path id="s3-ap" d="M30 145V8M8 32L30 8l22 24" /></svg>
        <div id="s3-x3" class="x3"></div>
        <div id="s3-c1" class="chip"><span class="ic"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M12 3v18M7 8l3-3M14 14l4-4"/></svg></span>Verre</div>
        <div id="s3-c2" class="chip"><span class="ic"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></span>Lignes de lumière</div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          HIn(tl, "#s3-a", 0, "up", 0.75);
          // "le regard s'élève": the card tilts up like a camera looking up at the volumes
          tl.fromTo("#s3-a", { rotationX: -14, y: 40 }, { rotationX: 10, y: -30, duration: 3.6, ease: "sine.inOut", immediateRender: false }, 0.75);
          tl.from("#s3-k", { opacity: 0, x: -40, duration: 0.5, ease: "expo.out" }, 0.27);
          HLine(tl, "#s3-t1", 1.85);
          tl.fromTo("#s3-ap", { strokeDasharray: 260, strokeDashoffset: 260 }, { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" }, 2.0);
          tl.fromTo("#s3-arrow", { y: 40 }, { y: -20, duration: 1.4, ease: "sine.inOut", immediateRender: false }, 2.0);
          tl.to(["#s3-k", "#s3-l1", "#s3-arrow"], { opacity: 0, y: -40, duration: 0.3, ease: "power2.in" }, 3.45);
          HTitle(tl, document.getElementById("s3-x3"), "VOLUMES", 600, 430, 3.76, { size: 160, r: 520, seed: 11, hold: 2.0, out: { y: -900, opacity: 0, filter: "blur(16px)" }, outAt: 6.2 });
          HSheen(tl, "#s3-sha", 4.0);
          HChip(tl, "#s3-c1", 5.65);
          HChip(tl, "#s3-c2", 6.7);
          // second card slides in next to the first: the lit wood ceiling
          tl.to("#s3-a", { x: -560, rotationY: 12, rotationX: 0, y: 0, duration: 0.6, ease: "expo.inOut" }, 6.15);
          HIn(tl, "#s3-b", 6.35, "down", 0.7);
          tl.fromTo("#s3-b", { rotationY: -10 }, { rotationY: 6, duration: 1.6, ease: "sine.inOut", immediateRender: false }, 7.05);
          HSheen(tl, "#s3-shb", 6.9);
          window.__timelines["s3-entree"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
