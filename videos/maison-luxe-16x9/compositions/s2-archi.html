<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s2-root { position: absolute; inset: 0; overflow: hidden; }
        #s2-card { left: 170px; }
        #s2-k { left: 680px; top: 560px; width: 1000px; text-align: center; }
        #s2-l1 { left: 680px; top: 690px; width: 1000px; text-align: center; }
        #s2-rule { position: absolute; left: 930px; top: 800px; width: 500px; height: 3px; border-radius: 2px; background: linear-gradient(90deg, rgba(242,199,122,0), #F2C77A 50%, rgba(242,199,122,0)); box-shadow: 0 0 16px #FFAA33; }
      </style>
      <div id="s2-root" data-composition-id="s2-archi" data-width="1920" data-height="1080">
        <video id="s2-bgv" class="bgv" src="assets/bg/entree.mp4" muted playsinline data-start="0" data-duration="4.5"></video>
        <div class="shade"></div>
        <div class="stage3d">
          <div id="s2-card" class="card">
            <video id="s2-v" src="assets/clips/entree.mp4" muted playsinline data-start="0" data-duration="4.5"></video>
            <div id="s2-sh" class="sheen"></div>
          </div>
        </div>
        <div id="s2-x3" class="x3"></div>
        <div id="s2-k" class="kicker">Contemporaine</div>
        <div id="s2-l1" class="ln say"><span id="s2-t1">Sculptée par la <b>lumière</b>.</span></div>
        <div id="s2-rule"></div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          HIn(tl, "#s2-card", 0, "flyR", 0.75);
          HDrift(tl, "#s2-card", 0.75, 3.75, 1);
          HTitle(tl, document.getElementById("s2-x3"), "ARCHITECTURE", 1180, 430, 0.25, { size: 116, r: 560, seed: 8, ry0: -10, ry1: 10, hold: 3.4 });
          tl.from("#s2-k", { opacity: 0, y: 24, scale: 1.3, duration: 0.7, ease: "expo.out" }, 1.3);
          HLine(tl, "#s2-t1", 2.4);
          tl.from("#s2-rule", { scaleX: 0, duration: 0.8, ease: "expo.out" }, 3.2);
          HSheen(tl, "#s2-sh", 3.2);
          tl.fromTo("#s2-card", { filter: "brightness(1)" }, { filter: "brightness(1.35)", duration: 0.25, yoyo: true, repeat: 1, immediateRender: false }, 3.3);
          window.__timelines["s2-archi"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
