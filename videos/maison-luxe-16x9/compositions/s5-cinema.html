<!doctype html>
<html>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #s5-root { position: absolute; inset: 0; overflow: hidden; }
        #s5-card { left: 1300px; }
        #s5-k { left: 220px; top: 300px; width: 800px; text-align: center; }
        #s5-l1 { left: 220px; top: 610px; width: 800px; text-align: center; }
        #s5-stars { position: absolute; inset: 0; }
        .s5-st { position: absolute; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 3px; background: #FFF3DC; box-shadow: 0 0 10px #FFD58A, 0 0 3px #fff; }
      </style>
      <div id="s5-root" data-composition-id="s5-cinema" data-width="1920" data-height="1080">
        <video id="s5-bgv" class="bgv" src="assets/bg/cinema-s.mp4" muted playsinline data-start="1.2" data-duration="3.9"></video>
        <div class="shade"></div>
        <div id="s5-stars"></div>
        <div id="s5-x3a" class="x3"></div>
        <div class="stage3d">
          <div id="s5-card" class="card">
            <video id="s5-v" src="assets/clips/cinema-s.mp4" muted playsinline data-start="1.2" data-duration="3.9"></video>
            <div id="s5-sh" class="sheen"></div>
          </div>
        </div>
        <div id="s5-k" class="kicker">Salle de cinéma</div>
        <div id="s5-x3b" class="x3"></div>
        <div id="s5-l1" class="ln say"><span id="s5-t1">sous un ciel <b>étoilé</b></span></div>
      </div>
      <script>
        (function () {
          const tl = gsap.timeline({ paused: true });
          // starfield: deterministic twinkle, brightens on "ciel étoilé"
          const host = document.getElementById("s5-stars");
          let seed = 17;
          const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
          const stars = [];
          for (let i = 0; i < 90; i++) {
            const s = document.createElement("div");
            s.className = "s5-st";
            s.style.left = Math.round(rnd() * 1920) + "px";
            s.style.top = Math.round(rnd() * 1080) + "px";
            host.appendChild(s);
            stars.push(s);
            const sc = 0.4 + rnd() * 1.1;
            tl.fromTo(s, { opacity: 0, scale: sc }, { opacity: 0.3 + rnd() * 0.7, duration: 0.4 + rnd() * 0.6, ease: "sine.inOut", yoyo: true, repeat: 7, immediateRender: true }, rnd() * 0.8);
            tl.to(s, { scale: sc * 1.8, duration: 0.3, ease: "back.out(3)", yoyo: true, repeat: 1 }, 3.45 + rnd() * 0.5);
          }
          tl.fromTo("#s5-stars", { scale: 1.25 }, { scale: 1, duration: 5.3, ease: "power1.out" }, 0);
          HTitle(tl, document.getElementById("s5-x3a"), "CÔTÉ DÉTENTE", 960, 540, 0.2, { size: 130, r: 600, seed: 5, hold: 0.5, burstHold: 0.7, out: { z: 1300, opacity: 0, filter: "blur(14px)" }, outAt: 1.1 });
          HIn(tl, "#s5-card", 1.2, "spin", 0.8);
          HDrift(tl, "#s5-card", 2.0, 2.9, -1);
          tl.from("#s5-k", { opacity: 0, y: 24, scale: 1.3, duration: 0.6, ease: "expo.out" }, 2.1);
          HTitle(tl, document.getElementById("s5-x3b"), "CINÉMA", 620, 470, 2.2, { size: 170, r: 480, seed: 23, hold: 2.5 });
          HLine(tl, "#s5-t1", 3.45);
          HSheen(tl, "#s5-sh", 3.5);
          HOut(tl, "#s5-card", 4.95, "up");
          window.__timelines["s5-cinema"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
